name: Update site data and history

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pod-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r scripts/site-requirements.txt
      - name: Run pipeline tests
        run: python -m unittest discover -s tests -p 'test_site_pipeline.py'
      - name: Collect and archive a validated snapshot
        run: python scripts/site_pipeline.py
      - name: Commit snapshot and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- sc_ladder.json hc_ladder.json jsons/ data/ Season/
          if git diff --cached --quiet; then
            echo "No site data changes"
          else
            git commit -m "Update Trends data and history"
            git push
          fi
