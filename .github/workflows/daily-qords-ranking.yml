name: Daily Qord Ranking Update

on:
  schedule:
    # Daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pod-data-writes
  cancel-in-progress: false

jobs:
  generate-qord-rankings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check season freeze policy
        id: season
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          from scripts.site_pipeline import get_season

          with open("site_config.json", encoding="utf-8") as file:
              config = json.load(file)
          if not isinstance(config.get("post_season_updates"), bool):
              raise ValueError("post_season_updates must be true or false")
          allowed = config["post_season_updates"] or get_season(requests.Session())["status"] == "active"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_ranking={'true' if allowed else 'false'}\n")
          if not allowed:
              print("Season ended; rankings are frozen.")
          PY

      - name: Verify ranking script exists
        if: steps.season.outputs.run_ranking == 'true'
        run: |
          if [ ! -f generate_qords_ranking.py ]; then
            echo "generate_qords_ranking.py was not found at repo root."
            echo "Copy the script into pod-stats/ before running this workflow."
            exit 1
          fi

      - name: Generate ranking pages
        if: steps.season.outputs.run_ranking == 'true'
        run: |
          python generate_qords_ranking.py

      - name: Commit and push changes
        if: steps.season.outputs.run_ranking == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

            git add ranking.html hcranking.html \
              ranking-noitems.html hcranking-noitems.html \
              ranking-xp-breakdown.html hcranking-xp-breakdown.html

          if ! git diff --cached --quiet; then
            git commit -m "Daily Qord ranking update"
            git push
          else
            echo "No ranking file changes to commit"
          fi
