name: Daily Ladder Data Fetch (Season Protected)

on:
  schedule:
    # Run every day at 6:00 AM and 6:00 PM UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allow manual triggering
    inputs:
      force:
        description: 'Force fetch even if the season is frozen'
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # Allow the workflow to write to the repository

jobs:
  fetch-ladder-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests matplotlib
        
    - name: Create necessary directories
      run: |
        mkdir -p charts
        mkdir -p armory/font
        
    - name: Download armory font (if needed for charts)
      run: |
        # Create a simple fallback if font is not available
        echo "Font directory created for potential future use"
        
    - name: Check season status
      id: season_check
      run: |
        if [ "${{ github.event.inputs.force }}" == "true" ]; then
          echo "🔓 Force override enabled - skipping season freeze check"
          echo "season_frozen=false" >> "$GITHUB_OUTPUT"
        else
          python -c "
          import sys
          sys.path.append('scripts')
          from api_integration import should_freeze_live_site
          frozen = should_freeze_live_site()
          if frozen:
              print('🔒 Season is frozen - skipping ladder fetch')
              print('season_frozen=true' >> '$GITHUB_OUTPUT')
          else:
              print('✅ Season is active - proceeding with fetch')
              print('season_frozen=false' >> '$GITHUB_OUTPUT')
          "
        fi
        
    - name: Run ladder data fetch
      if: steps.season_check.outputs.season_frozen == 'false'
      run: |
        cd scripts
        python fetch_ladder_data.py
        
    - name: Move JSON files to root
      if: steps.season_check.outputs.season_frozen == 'false'
      run: |
        # Move the generated JSON files to the root directory where other scripts expect them
        if [ -f scripts/sc_ladder.json ]; then
          mv scripts/sc_ladder.json .
        fi
        if [ -f scripts/hc_ladder.json ]; then
          mv scripts/hc_ladder.json .
        fi
        
    - name: Create Class JSON's
      if: steps.season_check.outputs.season_frozen == 'false'
      run: |
        cd new-ideas
        python create-class-jsons.py

    - name: Commit and push changes
      if: steps.season_check.outputs.season_frozen == 'false'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          # Create commit with timestamp
          git commit -m "📊 Daily ladder data update - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main
        fi
        
    - name: Log season frozen status
      if: steps.season_check.outputs.season_frozen == 'true'
      run: |
        echo "🔒 Ladder fetch skipped - season is frozen"
        echo "ℹ️  This is expected behavior during season transitions"
        echo "🔓 Re-run this workflow manually with 'force' enabled to override"
        
    - name: Log completion
      if: steps.season_check.outputs.season_frozen == 'false'
      run: |
        echo "✅ Daily ladder data fetch completed successfully"
        if [ -f sc_ladder.json ]; then
          echo "📈 SC Ladder: $(cat sc_ladder.json | jq '. | length') characters"
        fi
        if [ -f hc_ladder.json ]; then
          echo "📈 HC Ladder: $(cat hc_ladder.json | jq '. | length') characters"
        fi
