name: Workflow Discovery Test

on:
  push:
    branches: [main]
    paths: ['.github/workflows/workflow-discovery-test.yml']

jobs:
  discover-workflows:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger workflow discovery
      run: |
        echo "🔍 This workflow helps GitHub discover manual workflows"
        echo "✅ After this runs, manual workflows should show 'Run workflow' buttons"
        echo "📋 Manual workflows available:"
        echo "   - Force Page Update (.github/workflows/force-update.yml)"
        echo "   - Manual Archive Creation (.github/workflows/manual-archive.yml)"
        echo "🎯 Discovery complete! You can manually delete this file if desired"
        echo "💡 Check the Actions tab - manual workflows should now have 'Run workflow' buttons"