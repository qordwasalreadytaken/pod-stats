name: Monthly Archive Generation

on:
  schedule:
    # Run on the 28th of every month at 2:00 AM UTC
    - cron: '0 2 28 * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write  # Allow the workflow to write to the repository

jobs:
  create-monthly-archive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # Fetch all history for proper archiving
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt
        
    - name: Create necessary directories
      run: |
        mkdir -p charts
        mkdir -p armory/font
        mkdir -p Season
        mkdir -p recovery_points
        
    - name: Download required assets
      run: |
        # Download avqest.ttf font if needed
        if [ ! -f armory/font/avqest.ttf ]; then
          echo "Font file not found, creating placeholder"
          touch armory/font/avqest.ttf
        fi
        
    - name: Run monthly archive generation
      run: |
        python scripts/api_integration.py archive monthly
        
    - name: Verify archive creation
      run: |
        # Check if archive was created successfully
        CURRENT_SEASON=$(ls Season/ | tail -1)
        if [ -d "Season/${CURRENT_SEASON}/November" ] || [ -d "Season/${CURRENT_SEASON}/December" ] || [ -d "Season/${CURRENT_SEASON}/January" ]; then
          echo "✅ Monthly archive created successfully"
          ls -la Season/${CURRENT_SEASON}/
        else
          echo "❌ Archive creation may have failed"
          exit 1
        fi
        
    - name: Commit and push archive
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Archive Bot"
        git add -A
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          # Create commit with archive info
          CURRENT_SEASON=$(ls Season/ | tail -1)
          ARCHIVE_MONTH=$(date +%B)
          git commit -m "🗄️ Monthly archive created: Season ${CURRENT_SEASON}/${ARCHIVE_MONTH} - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main
        fi
        
    - name: Log completion
      run: |
        echo "✅ Monthly archive generation completed successfully"
        CURRENT_SEASON=$(ls Season/ | tail -1)
        echo "📊 Archive Location: Season/${CURRENT_SEASON}/"
        if [ -d "Season/${CURRENT_SEASON}" ]; then
          echo "📁 Archive Contents:"
          ls -la Season/${CURRENT_SEASON}/*/
        fi