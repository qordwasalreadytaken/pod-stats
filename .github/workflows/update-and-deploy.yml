# Update Data and Deploy to GitHub Pages
name: Update PoD Analytics and Deploy

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  
  # Runs twice daily at 6 AM and 6 PM UTC to fetch fresh data
  schedule:
    - cron: '0 6,18 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Generate fresh analytics data
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          
      - name: Fetch fresh data and generate analytics pages
        run: |
          echo "📡 Fetching fresh API data and updating tracking files..."
          python3 scripts/generate_pages.py --page dataupdate
          
          echo "🛡️ Generating all softcore pages..."
          python3 scripts/generate_pages.py --page all --mode sc
          
          echo "⚔️ Generating all hardcore pages..."
          python3 scripts/generate_pages.py --page all --mode hc
          
          echo "✅ All page generation completed!"
          
      - name: Commit and push if changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Remove any pycache directories that might have been created
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          
          # Add only the files we want (HTML, CSS, JS, data files)
          git add *.html
          git add *.css
          git add *.js
          git add *.json
          git add *.csv
          git add README.md 2>/dev/null || true
          
          if ! git diff --cached --quiet; then
            git commit -m "Update PoD analytics data - $(date)"
            git push
          else
            echo "No changes to commit"
          fi

  # Deploy to GitHub Pages
  deploy:
    needs: update-data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # Get the updated content
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4