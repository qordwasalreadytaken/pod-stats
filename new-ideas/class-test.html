// Armory pop up
document.addEventListener("DOMContentLoaded", function () {
    let activePopup = null;

    document.addEventListener("click", function (event) {

        const trigger = event.target.closest(".hover-trigger");

        if (!trigger) {
            return;
        }

        console.log("Trigger clicked");

        event.stopPropagation();

        const characterName = trigger.getAttribute("data-character-name");

        // Find the associated popup
        const popup = trigger
            .closest(".character-info")
            .querySelector(".popup");

        // If this popup is already active, close it
        if (popup === activePopup) {
            popup.classList.remove("active");
            popup.innerHTML = "";
            activePopup = null;
            return;
        }

        // Close any other open popup
        if (activePopup) {
            activePopup.classList.remove("active");
            activePopup.innerHTML = "";
            activePopup = null;
        }

        // Create iframe
        const iframe = document.createElement("iframe");

        iframe.src = `../armory/video_component.html?charName=${characterName}`;
        iframe.setAttribute("id", "popupFrame");

        popup.appendChild(iframe);
        popup.classList.add("active");

        activePopup = popup;
    });

    // Close popup when clicking outside
    document.addEventListener("click", function (event) {

        if (
            activePopup &&
            !event.target.closest(".character-info")
        ) {
            activePopup.classList.remove("active");
            activePopup.innerHTML = "";
            activePopup = null;
        }
    });
});

/*
 * Collapsible button/content pattern matching the site's existing
 * pages (icons swap, .content toggles display).
 */
function toggleCollapsible(button) {

    const content = button.nextElementSibling;
    if (!content) return;

    const collapsedIcon = button.querySelector(".icon-collapsed");
    const expandedIcon = button.querySelector(".icon-expanded");
    const isCollapsed = content.style.display === "none" || content.style.display === "";

    content.style.display = isCollapsed ? "block" : "none";

    if (collapsedIcon && expandedIcon) {
        collapsedIcon.classList.toggle("hidden", isCollapsed);
        expandedIcon.classList.toggle("hidden", !isCollapsed);
    }

}

/*
 * Load the data
 */
async function loadCharacters() {

    const status = document.getElementById("status");

    try {

        console.time("Total load");

        const fetchStart = performance.now();

        const response =
//            await fetch(`./data/${chosenClass}.json`);
            await fetch(`./data/${chosenMode}${chosenClass}.json`)

        const fetchEnd = performance.now();

        console.log(
            `Network request: ${(fetchEnd - fetchStart).toFixed(2)} ms`
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}: ${response.statusText}`
            );
        }

        console.time("JSON parse");

        characters = await response.json();

        console.timeEnd("JSON parse");
        console.timeEnd("Total load");

        if (!Array.isArray(characters)) {

            if (Array.isArray(characters.characters)) {
                characters = characters.characters;
            } else {
                throw new Error(
                    "JSON loaded, but couldn't find a character array."
                );
            }

        }

        status.innerHTML =
            `Loaded <strong>${characters.length.toLocaleString()}</strong> characters.`;

        console.log("First character:");
        console.log(characters[0]);

        console.log("Character object keys:");
        console.log(Object.keys(characters[0] || {}));

        skillColumns = getSkillColumns(characters);

        applyFilters();

    } catch (error) {

        console.error(error);

        status.innerHTML =
            `<span class="error">Error loading data: ${error.message}</span>`;

    }
}

/*
 * Apply the current filters
 */
function applyFilters() {

    console.time("Filter");

    const search =
        document.getElementById("search").value
            .trim()
            .toLowerCase();

    const minLevelValue =
        document.getElementById("minLevel").value;

    const maxLevelValue =
        document.getElementById("maxLevel").value;

    const minLevel =
        minLevelValue === ""
            ? null
            : Number(minLevelValue);

    const maxLevel =
        maxLevelValue === ""
            ? null
            : Number(maxLevelValue);

    console.log(`Chosen class: ${chosenClass}`);

    filteredCharacters = characters.filter(character => {

        const name =
            character.Name ??
            "";

        const level =
            Number(
                character.Stats.Level ??
                0
            );

        if (
            search &&
            !String(name)
                .toLowerCase()
                .includes(search)
        ) {
            return false;
        }

        if (
            minLevel !== null &&
            level < minLevel
        ) {
            return false;
        }

        if (
            maxLevel !== null &&
            level > maxLevel
        ) {
            return false;
        }

        return true;

    });

    console.timeEnd("Filter");

    sortCharacters();
    renderCharacters();
    clusterBuilds();
    renderClusters();
    renderItemReporting();
}

/*
 * Collect every skill name that appears across the
 * character set, so every skill vector has the same shape.
 */
function getSkillColumns(allCharacters) {

    const names = new Set();

    for (const character of allCharacters) {
        for (const tab of character.SkillTabs ?? []) {
            for (const skill of tab.Skills ?? []) {
                names.add(skill.Name);
            }
        }
    }

    return Array.from(names);

}


/*
 * Build a skill-points vector (in skillColumns order) for one character.
 */
function buildSkillVector(character) {

    const levels = new Map();

    for (const tab of character.SkillTabs ?? []) {
        for (const skill of tab.Skills ?? []) {
            levels.set(skill.Name, skill.Level);
        }
    }

    return skillColumns.map(name => levels.get(name) ?? 0);

}


function cosineSimilarity(a, b) {

    let dot = 0;
    let normA = 0;
    let normB = 0;

    for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i];
        normA += a[i] * a[i];
        normB += b[i] * b[i];
    }

    if (normA === 0 || normB === 0) {
        return 0;
    }

    return dot / (Math.sqrt(normA) * Math.sqrt(normB));

}


/*
 * Greedy similarity clustering, matching class_pages.py's
 * _similarity_cluster: for each unassigned character, group it
 * with every other unassigned character whose cosine similarity
 * is >= threshold. Anything left over becomes one misc cluster.
 */
function clusterBuilds() {

    console.time("Cluster");

    const threshold =
        Number(document.getElementById("threshold").value) || 0.65;

    const vectors =
        filteredCharacters.map(buildSkillVector);

    const n = vectors.length;

    const clusterIndex = new Array(n).fill(-1);

    let clusterId = 0;

    for (let i = 0; i < n; i++) {

        if (clusterIndex[i] !== -1) {
            continue;
        }

        const similarIndices = [];

// old method without checking clusterIndex
//    for (let j = 0; j < n; j++) {
//        if (cosineSimilarity(vectors[i], vectors[j]) >= threshold) {
//            similarIndices.push(j);
//        }
//    }

// new method with checking clusterIndex
    for (let j = 0; j < n; j++) {

        if (clusterIndex[j] !== -1) {
            continue;
        }

        if (cosineSimilarity(vectors[i], vectors[j]) >= threshold) {
            similarIndices.push(j);
        }
    }

        if (similarIndices.length > 1) {
            for (const j of similarIndices) {
                clusterIndex[j] = clusterId;
            }
            clusterId++;
        }

    }

    const miscIndices = [];

    for (let i = 0; i < n; i++) {
        if (clusterIndex[i] === -1) {
            clusterIndex[i] = clusterId;
            miscIndices.push(i);
        }
    }

    const miscClusterId =
        miscIndices.length > 0 ? clusterId : null;

    const grouped = new Map();

    for (let i = 0; i < n; i++) {

        const id = clusterIndex[i];

        if (!grouped.has(id)) {
            grouped.set(id, []);
        }

        grouped.get(id).push({
            character: filteredCharacters[i],
            vector: vectors[i]
        });

    }

    clusters = Array.from(grouped.entries()).map(([id, members]) => {

        const averages =
            skillColumns.map((_, colIndex) =>
                members.reduce((sum, m) => sum + m.vector[colIndex], 0) /
                members.length
            );

        const topSkills =
            skillColumns
                .map((name, colIndex) => ({ name, average: averages[colIndex] }))
                .filter(skill => skill.average >= 1)
                .sort((a, b) => b.average - a.average)
                .slice(0, 5);

        return {
            id,
            isMisc: id === miscClusterId,
            members,
            label: topSkills
                .map(skill => `
                    <div class="skillbar-container">
                    <div class="skill-row">
                    <div class="skill-bar-container">
                    &nbsp;&nbsp;<img src="../icons/${escapeHtml(skill.name)}.png" alt="${escapeHtml(skill.name)}" class="skill-icon-smaller"> 
                    <div class="skill-bar" >
                    <span class="skill-label">                    
<!--                        <img src="../icons/${escapeHtml(skill.name)}.png" alt="${escapeHtml(skill.name)}" class="skill-icon-smaller"> -->
                        ${escapeHtml(skill.name)}(${skill.average.toFixed(0)*members.length})
                    </span>
                    </div>
                    </div>
                    </div>
                    </div>`)

                .join(" "),
        };

    });

    clusters.sort((a, b) => b.members.length - a.members.length);

    console.timeEnd("Cluster");

}

function getTopSkills(characters, limit = 5) {

    const skills = new Map();

    for (const character of characters) {

        for (const tab of character.SkillTabs ?? []) {

            for (const skill of tab.Skills ?? []) {

                const level =
                    Number(skill.Level) || 0;

                if (!skills.has(skill.Name)) {
                    skills.set(skill.Name, {
                        total: 0,
                        users: 0
                    });
                }

                const entry = skills.get(skill.Name);

                entry.total += level;

                if (level > 1) {
                    entry.users++;
                }
            }
        }
    }

    return Array.from(skills.entries())
        .map(([skill, data]) => ({
            skill,
            average: data.total / characters.length,
            users: data.users,
            percent: (data.users / characters.length) * 100
        }))
        .sort((a, b) => b.average - a.average)
        .slice(0, limit);
}

function getAllSkills(characters, limit = 90) {

    const skills = new Map();

    for (const character of characters) {

        for (const tab of character.SkillTabs ?? []) {

            for (const skill of tab.Skills ?? []) {

                const level =
                    Number(skill.Level) || 1;

                if (!skills.has(skill.Name)) {
                    skills.set(skill.Name, {
                        total: 0,
                        users: 0
                    });
                }

                const entry = skills.get(skill.Name);

                entry.total += level;

                if (level > 1) {
                    entry.users++;
                }
            }
        }
    }

    return Array.from(skills.entries())
        .map(([skill, data]) => ({
            skill,
            average: data.total / characters.length,
            users: data.users,
            percent: (data.users / characters.length) * 100
        }))
        .sort((a, b) => b.average - a.average)
        .slice(0, limit);
}

function summarizeFavoredSkillTrees(
    characters,
    treeThreshold = 60,
    hybridThreshold = 35
) {

    const trees = skillTrees[chosenClass];

    if (!trees || characters.length === 0) {
        return null;
    }

    const favoredCounts = {};
    const hybridCounts = {};

    for (const treeName of Object.keys(trees)) {
        favoredCounts[treeName] = 0;
    }

    /*
     * Examine each character individually.
     */
    for (const character of characters) {

        const treePoints = {};

        for (const treeName of Object.keys(trees)) {
            treePoints[treeName] = 0;
        }

        /*
         * Add the character's points for each skill
         * belonging to each tree.
         */
        for (const [treeName, skills] of Object.entries(trees)) {

            for (const skillName of skills) {

                for (const tab of character.SkillTabs ?? []) {

                    for (const skill of tab.Skills ?? []) {

                        if (skill.Name === skillName) {
                            treePoints[treeName] +=
                                Number(skill.Level) || 0;
                        }

                    }

                }

            }

        }

        /*
         * Favored trees
         */
        for (const [treeName, points] of Object.entries(treePoints)) {

            if (points >= treeThreshold) {
                favoredCounts[treeName]++;
            }

        }

        /*
         * Hybrid builds
         */
        const highTrees =
            Object.entries(treePoints)
                .filter(([_, points]) =>
                    points >= hybridThreshold
                )
                .map(([treeName]) => treeName);

        if (highTrees.length >= 2) {

            const label =
                highTrees.length === Object.keys(trees).length
                    ? "all trees"
                    : highTrees.sort().join(" + ");

            hybridCounts[label] =
                (hybridCounts[label] ?? 0) + 1;
        }

    }

    /*
     * Convert counts to percentages.
     */
    const total = characters.length;

    const favored = Object.entries(favoredCounts)
        .filter(([_, count]) => count > 0)
        .sort((a, b) => b[1] - a[1])
        .map(([tree, count]) => ({
            tree,
            count,
            percent: (count / total) * 100
        }));

    const hybrids = Object.entries(hybridCounts)
        .sort((a, b) => b[1] - a[1])
        .map(([trees, count]) => ({
            trees,
            count,
            percent: (count / total) * 100
        }));

    return {
        total,
        favored,
        hybrids
    };
}

function renderSkillTreeSummary(summary) {

    if (!summary) {
        return "";
    }

    return `
        <h3>${capitalize(chosenClass)} Skill Tree Summary</h3>
            <table style='width:100%;'><tr><td style='vertical-align:top;'>
            <strong>Favored Trees:</strong><br>
            
            ${summary.favored.map(item => `
            <div>
                &nbsp;&nbsp;&nbsp;&nbsp;${item.percent.toFixed(2)}%

        `).join("")}
        </td><td style='vertical-align:top;'>
        <br>
        <td style='vertical-align:top;'>

        ${summary.hybrids.length > 0
            ? summary.hybrids.map(item => `

                    &nbsp;&nbsp;&nbsp;&nbsp;${item.percent.toFixed(2)}%
                    invest in ${escapeHtml(item.trees)}

            `).join("")
            : "<div><i>No hybrid builds found</i></div>"
        }
        </td></tr></table>
    `;
}

/*
 * Global item reporting: runewords, uniques, sets, synth, crafted,
 * magic, and rare items, matching class_pages.py's
 * _analyze_equipment_patterns / _process_all_characters* methods.
 */

const CRAFT_CATEGORIES = [
    "Rings", "Weapons and Shields", "Arrows", "Bolts",
    "Body Armor", "Gloves", "Belts", "Helmets", "Boots", "Amulets"
];


function categorizeWornSlot(worn, textTag) {

    if (worn === "ring1" || worn === "ring2") {
        return "Rings";
    }

    if (["sweapon1", "weapon1", "sweapon2", "weapon2"].includes(worn)) {
        if (textTag === "Arrow") return "Arrows";
        if (textTag === "Bolt") return "Bolts";
        return "Weapons and Shields";
    }

    const slotMap = {
        body: "Body Armor", gloves: "Gloves", belt: "Belts",
        helmet: "Helmets", boots: "Boots", amulet: "Amulets"
    };

    return slotMap[worn] || "Weapons and Shields";

}


function addUser(counterMap, key, character, base) {

    if (!counterMap.has(key)) {
        counterMap.set(key, { count: 0, users: [] });
    }

    const entry = counterMap.get(key);
    entry.count++;
    entry.users.push({
        name: character.Name || "Unknown",
        level: character.Stats?.Level ?? "Unknown",
        base: base || null
    });

}


function addCategorizedUser(categoryMap, category, key, character) {

    if (!categoryMap.has(category)) {
        categoryMap.set(category, new Map());
    }

    addUser(categoryMap.get(category), key, character);

}


function computeEquipmentAnalysis(charactersToAnalyze) {

    const runewords = new Map();
    const uniques = new Map();
    const sets = new Map();
    const synth = new Map();
    const synthSources = new Map();
    const crafted = new Map();
    const magic = new Map();
    const rare = new Map();

    for (const character of charactersToAnalyze) {
        for (const item of character.Equipped || []) {

            const title = item.Title || "Unknown Item";
            const qualityCode = item.QualityCode || "default";
            const worn = item.Worn || "Unknown";
            const textTag = item.TextTag || "";
            const tag = item.Tag || "";
            const category = categorizeWornSlot(worn, textTag);

            if (qualityCode === "q_runeword") {
                addUser(runewords, title, character, item.Tag || "Unknown base");
            } else if (qualityCode === "q_unique") {
                addUser(uniques, title, character);
            } else if (qualityCode === "q_set") {
                addUser(sets, title, character);
            }

            if (tag.toLowerCase().includes("synth") || textTag.toLowerCase().includes("synth")) {
                addUser(synth, title, character);

                const synthesizedFrom = item.SynthesisedFrom || [];
                const allRelatedItems = [title, ...synthesizedFrom];

                for (const sourceItem of allRelatedItems) {
                    if (!synthSources.has(sourceItem)) {
                        synthSources.set(sourceItem, []);
                    }
                    synthSources.get(sourceItem).push({
                        name: character.Name || "Unknown",
                        level: character.Stats?.Level ?? "Unknown",
                        synthesizedItem: title
                    });
                }
            } else if (qualityCode === "q_crafted") {
                addCategorizedUser(crafted, category, title, character);
            } else if (qualityCode === "q_magic") {
                addCategorizedUser(magic, category, title, character);
            } else if (qualityCode === "q_rare") {
                addCategorizedUser(rare, category, title, character);
            }

        }
    }

    return { runewords, uniques, sets, synth, synthSources, crafted, magic, rare };

}


/*
 * Socket reporting: what people put into sockets, matching
 * class_pages.py's _socket_html / count_items_by_type.
 */

const RUNE_NAMES = new Set([
    "El Rune", "Eld Rune", "Tir Rune", "Nef Rune", "Eth Rune", "Ith Rune", "Tal Rune", "Ral Rune", "Ort Rune", "Thul Rune", "Amn Rune", "Sol Rune",
    "Shael Rune", "Dol Rune", "Hel Rune", "Io Rune", "Lum Rune", "Ko Rune", "Fal Rune", "Lem Rune", "Pul Rune", "Um Rune", "Mal Rune", "Ist Rune",
    "Gul Rune", "Vex Rune", "Ohm Rune", "Lo Rune", "Sur Rune", "Ber Rune", "Jah Rune", "Cham Rune", "Zod Rune"
]);


function countSocketablesByType(items) {

    const runeCounter = new Map();
    const nonRuneCounter = new Map();
    const magicJewel = { "Misc. Magic Jewels": 0, splash: 0, "attack speed": 0, "enhanced damage": 0, iassplash: 0, iased: 0 };
    const rareJewel = { "Misc. Rare Jewels": 0, splash: 0, "enhanced damage": 0 };
    const facetCounter = new Map();

    for (const item of items) {

        const title = item.Title || "Unknown";
        const quality = item.QualityCode || "";
        const properties = item.PropertyList || [];

        if (RUNE_NAMES.has(title)) {

            runeCounter.set(title, (runeCounter.get(title) || 0) + 1);

        } else if (title.includes("Rainbow Facet")) {

            const elementTypes = ["fire", "cold", "lightning", "poison", "physical", "magic"];
            let element = "Unknown";

            outer:
            for (const elem of elementTypes) {
                for (const prop of properties) {
                    if (String(prop).toLowerCase().includes(elem)) {
                        element = elem.charAt(0).toUpperCase() + elem.slice(1);
                        break outer;
                    }
                }
            }

            if (!facetCounter.has(element)) {
                facetCounter.set(element, { count: 0, perfect: 0 });
            }

            const facet = facetCounter.get(element);
            facet.count++;

            const propText = properties.join(" ");
            if (propText.includes("+5%") && propText.includes("-5%")) {
                facet.perfect++;
            }

        } else if (quality === "q_magic") {

            magicJewel["Misc. Magic Jewels"]++;

            for (const prop of properties) {
                const propText = String(prop).toLowerCase();
                if (propText.includes("splash")) {
                    magicJewel.splash++;
                } else if (propText.includes("attack speed") || propText.includes("ias")) {
                    magicJewel["attack speed"]++;
                } else if (propText.includes("enhanced damage")) {
                    magicJewel["enhanced damage"]++;
                }
            }

            const hasIas = properties.some(prop => {
                const p = String(prop).toLowerCase();
                return p.includes("attack speed") || p.includes("ias");
            });
            const hasSplash = properties.some(prop => String(prop).toLowerCase().includes("splash"));
            const hasEd = properties.some(prop => String(prop).toLowerCase().includes("enhanced damage"));

            if (hasIas && hasSplash) magicJewel.iassplash++;
            if (hasIas && hasEd) magicJewel.iased++;

        } else if (quality === "q_rare") {

            rareJewel["Misc. Rare Jewels"]++;

            for (const prop of properties) {
                const propText = String(prop).toLowerCase();
                if (propText.includes("splash")) {
                    rareJewel.splash++;
                } else if (propText.includes("enhanced damage")) {
                    rareJewel["enhanced damage"]++;
                }
            }

        } else {

            nonRuneCounter.set(title, (nonRuneCounter.get(title) || 0) + 1);

        }

    }

    return { runeCounter, nonRuneCounter, magicJewel, rareJewel, facetCounter };

}


function computeSocketAnalysis(charactersToAnalyze) {

    const justSocketed = [];
    const justSocketedExcludingRunewords = [];

    for (const character of charactersToAnalyze) {
        for (const item of character.Equipped || []) {

            const socketables = item.Sockets || [];
            if (socketables.length === 0) continue;

            const isRuneword = item.QualityCode === "q_runeword";

            for (const socketed of socketables) {
                justSocketed.push(socketed);
                if (!isRuneword) {
                    justSocketedExcludingRunewords.push(socketed);
                }
            }

        }
    }

    return {
        all: countSocketablesByType(justSocketed),
        excluding: countSocketablesByType(justSocketedExcludingRunewords)
    };

}


function sortMapDesc(map) {
    return Array.from(map.entries()).sort((a, b) => b[1] - a[1]);
}


function renderRuneList(runeCounter) {

    const sorted = sortMapDesc(runeCounter);

    if (sorted.length === 0) {
        return "<p>No runes found.</p>";
    }

    return `<ul>${sorted.map(([name, count]) => `<li>${escapeHtml(name)}: ${count}</li>`).join("")}</ul>`;

}


function renderOtherSocketedItems(result) {

    const parts = [];

    for (const [title, count] of sortMapDesc(result.nonRuneCounter)) {
        parts.push(`${escapeHtml(title)}: ${count}`);
    }

    const magicJewel = result.magicJewel;
    parts.push(`Misc. Magic Jewels: ${magicJewel["Misc. Magic Jewels"]} (${magicJewel.splash} Splash, ${magicJewel["attack speed"]} IAS, ${magicJewel["enhanced damage"]} ED; ${magicJewel.iassplash} IAS/Splash, ${magicJewel.iased} IAS/ED)`);

    const rareJewel = result.rareJewel;
    parts.push(`Misc. Rare Jewels: ${rareJewel["Misc. Rare Jewels"]} (${rareJewel.splash} Splash, ${rareJewel["enhanced damage"]} ED)`);

    for (const [element, counts] of result.facetCounter) {
        parts.push(`Rainbow Facet (${escapeHtml(element)}): ${counts.count} (${counts.perfect} Perfect)`);
    }

    return `<ul>${parts.map(part => `<li>${part}</li>`).join("")}</ul>`;

}

/*
 * Mercenary reporting: type counts, popular merc names, and
 * popular equipment by merc type, matching class_pages.py's
 * _analyze_mercenary_patterns / _generate_mercenary_html.
 */

const MERC_WORN_MAP = {
    body: "Armor", helmet: "Helmet", weapon1: "Weapon", weapon2: "Offhand"
};


function computeMercenaryAnalysis(charactersToAnalyze) {

    const mercenaryCounts = new Map();
    const mercenaryNames = new Map();
    const mercenaryEquipment = new Map();

    for (const character of charactersToAnalyze) {

        const mercType = character.MercenaryType;
        if (!mercType) continue;

        const readableMercType = MERCENARY_NAME_MAP[mercType] || mercType;
        mercenaryCounts.set(readableMercType, (mercenaryCounts.get(readableMercType) || 0) + 1);

        const mercName = character.MercenaryName || "Unknown";
        mercenaryNames.set(mercName, (mercenaryNames.get(mercName) || 0) + 1);

        if (!mercenaryEquipment.has(readableMercType)) {
            mercenaryEquipment.set(readableMercType, new Map());
        }
        const wornCategories = mercenaryEquipment.get(readableMercType);

        for (const item of character.MercenaryEquipped || []) {

            const worn = item.Worn || "Unknown";
            const readableWorn = MERC_WORN_MAP[worn] || worn;
            const title = item.Title || "Unknown";

            if (!wornCategories.has(readableWorn)) {
                wornCategories.set(readableWorn, new Map());
            }

            const titleCounts = wornCategories.get(readableWorn);
            titleCounts.set(title, (titleCounts.get(title) || 0) + 1);

        }

    }

    return { mercenaryCounts, mercenaryNames, mercenaryEquipment };

}

    if (analysis.mercenaryCounts.size === 0) {

/*
 * Fun facts: alive count and top-5 stat leaderboards, matching
 * class_pages.py's _analyze_fun_facts.
 */

function statValue(character, statName) {

    const bonus = character.Bonus || {};

    if (statName === "MagicFind" || statName === "GoldFind") {
        const main = bonus.WeaponSetMain || {};
        const off = bonus.WeaponSetOffhand || {};
        return (bonus[statName] || 0) + (main[statName] || 0) + (off[statName] || 0);
    }

    const stats = character.Stats || {};
    return (stats[statName] || 0) + (bonus[statName] || 0);

}


function getTopCharactersByStat(charactersToAnalyze, statName) {

    return [...charactersToAnalyze]
        .sort((a, b) => statValue(b, statName) - statValue(a, statName))
        .slice(0, 5)
        .map(character => ({ name: character.Name || "Unknown", value: statValue(character, statName) }));

}


function median(values) {

    if (values.length === 0) return 0;

    const sorted = [...values].sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);

    return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;

}


function computeFunFacts(charactersToAnalyze) {

    const aliveCharacters = charactersToAnalyze.filter(character => !character.IsDead);
    const characterCount = charactersToAnalyze.length;

    const topStats = {
        Strength: getTopCharactersByStat(charactersToAnalyze, "Strength"),
        Dexterity: getTopCharactersByStat(charactersToAnalyze, "Dexterity"),
        Vitality: getTopCharactersByStat(charactersToAnalyze, "Vitality"),
        Energy: getTopCharactersByStat(charactersToAnalyze, "Energy"),
        Life: getTopCharactersByStat(charactersToAnalyze, "Life"),
        Mana: getTopCharactersByStat(charactersToAnalyze, "Mana"),
        MagicFind: getTopCharactersByStat(charactersToAnalyze, "MagicFind"),
        GoldFind: getTopCharactersByStat(charactersToAnalyze, "GoldFind")
    };

    let totalMf = 0, totalGf = 0, totalLife = 0, totalMana = 0;
    const mfValues = [], gfValues = [], lifeValues = [], manaValues = [];

    for (const character of charactersToAnalyze) {

        const mf = statValue(character, "MagicFind");
        const gf = statValue(character, "GoldFind");
        const life = (character.Stats || {}).Life || 0;
        const mana = (character.Stats || {}).Mana || 0;

        totalMf += mf;
        totalGf += gf;
        totalLife += life;
        totalMana += mana;

        mfValues.push(mf);
        gfValues.push(gf);
        lifeValues.push(life);
        manaValues.push(mana);

    }

    return {
        aliveCharacters,
        undeadCount: aliveCharacters.length,
        characterCount,
        topStats,
        averageMf: characterCount > 0 ? totalMf / characterCount : 0,
        averageGf: characterCount > 0 ? totalGf / characterCount : 0,
        averageLife: characterCount > 0 ? totalLife / characterCount : 0,
        averageMana: characterCount > 0 ? totalMana / characterCount : 0,
        medianMf: median(mfValues),
        medianGf: median(gfValues),
        medianLife: median(lifeValues),
        medianMana: median(manaValues)
    };

}


function renderTopStatList(topData) {

    return `<ul>${topData.map(({ name, value }) =>
        `<li><a href="https://beta.pathofdiablo.com/armory?name=${encodeURIComponent(name)}" target="_blank">${escapeHtml(name)}</a> (${Math.round(value).toLocaleString()})</li>`
    ).join("")}</ul>`;

}

function sortedEntries(counterMap) {
    return Array.from(counterMap.entries()).sort((a, b) => b[1].count - a[1].count);
}


function renderUserList(users) {

    return users.map(user =>
        `<div class="item-user-list-entry character-info">
            <a href="https://beta.pathofdiablo.com/armory?name=${encodeURIComponent(user.name)}" target="_blank">${escapeHtml(user.name)}</a>
            (Level ${escapeHtml(String(user.level))})

            </div>             
            <div class="character">
                <div class="popup hidden"></div>
            </div>
        </div>`
    ).join("");

}


function renderBaseGroups(users) {

    const baseGroups = new Map();

    for (const user of users) {
        const base = user.base || "Unknown base";
        if (!baseGroups.has(base)) {
            baseGroups.set(base, []);
        }
        baseGroups.get(base).push(user);
    }

    const sorted =
        Array.from(baseGroups.entries()).sort((a, b) => b[1].length - a[1].length);

    return sorted.map(([base, baseUsers]) =>
        smallCollapsible(`${escapeHtml(base)} (${baseUsers.length.toLocaleString()} users)`, `<div class="item-user-list">${renderUserList(baseUsers)}</div>`)
    ).join("");

}


function renderItemDetails(entries, { showBases = false } = {}) {

    return entries.map(([title, data]) =>
        smallCollapsible(
            `${escapeHtml(title)} (${data.count.toLocaleString()} users)`,
            `<div class="item-user-list">${showBases ? renderBaseGroups(data.users) : renderUserList(data.users)}</div>`
        )
    ).join("");

}


const COUNTER_SECTION_ICONS = {
    "Runewords": ["Runewords", "runewords-button"],
    "Uniques": ["Uniques", "uniques-button"],
    "Set Items": ["Sets", "sets-button"],
    "Synthesized Items": ["Special", "sets-button"]
};


function renderCounterSection(heading, counterMap, { showLeast = false, showBases = false } = {}) {

    const [iconName, buttonClass] = COUNTER_SECTION_ICONS[heading] || ["Special", "sets-button"];
    const entries = sortedEntries(counterMap);

    if (entries.length === 0) {
        return `<h3>${escapeHtml(heading)}</h3><p>No items found.</p>`;
    }

    const mostUsed = entries.slice(0, 5);
    const leastUsed = showLeast ? entries.slice(-5).reverse() : [];

    const contentHtml = `
        <div class="item-report-columns">
            <div>
                <h4>Most Used</h4>
                <ul>${mostUsed.map(([title, data]) => `<li>${escapeHtml(title)}: ${data.count}</li>`).join("")}</ul>
            </div>
            ${showLeast ? `
            <div>
                <h4>Least Used</h4>
                <ul>${leastUsed.map(([title, data]) => `<li>${escapeHtml(title)}: ${data.count}</li>`).join("")}</ul>
            </div>
            ` : ""}
        </div>
        ${smallCollapsible(`ALL ${escapeHtml(heading)}`, renderItemDetails(entries, { showBases }))}
    `;

    return `
        <h3>${escapeHtml(heading)}</h3>
        ${bigCollapsible(iconName, buttonClass, contentHtml)}
    `;

}


function renderCategorizedSection(heading, categoryMap) {

    if (categoryMap.size === 0) {
        return `<h3>${escapeHtml(heading)}</h3><p>No items found.</p>`;
    }

    let categoriesHtml = "";

    for (const category of CRAFT_CATEGORIES) {

        const counterMap = categoryMap.get(category);
        if (!counterMap || counterMap.size === 0) continue;

        const entries = sortedEntries(counterMap);
        const mostUsed = entries.slice(0, 5);

        categoriesHtml += `
            <h4>${escapeHtml(category)}</h4>
            <ul>${mostUsed.map(([title, data]) => `<li>${escapeHtml(title)}: ${data.count}</li>`).join("")}</ul>
            ${smallCollapsible(`ALL ${entries.length.toLocaleString()} ${escapeHtml(category)} items`, renderItemDetails(entries))}
        `;

    }

    return `
        <h3>${escapeHtml(heading)}</h3>
        ${bigCollapsible("Special", "sets-button", categoriesHtml)}
    `;

}


function renderSynthSourceUserList(users) {

    return users.map(user =>
        `<div class="item-user-list-entry character-info">
            <a href="https://beta.pathofdiablo.com/armory?name=${encodeURIComponent(user.name)}" target="_blank">${escapeHtml(user.name)}</a>
            (Level ${escapeHtml(String(user.level))}) &mdash; Used in: <strong>${escapeHtml(user.synthesizedItem)}</strong>

            <div class="hover-trigger" data-character-name="${encodeURIComponent(user.name)}">
                <!-- Armory Quickview -->

            <div class="character">

            </div>

}


function renderSynthSourcesSection(synthSources) {

    if (synthSources.size === 0) {
        return `<h3>Synthesized From</h3><p>No synthesized items found.</p>`;
    }

    const entries =
        Array.from(synthSources.entries()).sort((a, b) => b[1].length - a[1].length);

    const itemsHtml = entries.map(([source, users]) =>
        smallCollapsible(`${escapeHtml(source)} (Found in ${users.length.toLocaleString()} Items)`, `<div class="item-user-list">${renderSynthSourceUserList(users)}</div>`)
    ).join("");

    return `
        <h3 id="synth-from">Synthesized From</h3>
        <p>Shows where an item's properties are showing up in other items &mdash; e.g. where the slow from Kelpie or the ball lightning from Ondal's Wisdom ended up.</p>
        ${bigCollapsible("Special", "sets-button", smallCollapsible(`All ${entries.length.toLocaleString()} sources`, itemsHtml))}
    `;

}


function renderItemReporting() {

    const analysis = computeEquipmentAnalysis(filteredCharacters);
    const grid = document.getElementById("itemReportGrid");

    grid.innerHTML =
        renderCounterSection("Runewords", analysis.runewords, { showLeast: true, showBases: true }) +
        renderCounterSection("Uniques", analysis.uniques, { showLeast: true }) +
        renderCounterSection("Set Items", analysis.sets, { showLeast: true }) +
        renderCounterSection("Synthesized Items", analysis.synth) +
        renderSynthSourcesSection(analysis.synthSources) +
        renderCategorizedSection("Crafted Items", analysis.crafted) +
        renderCategorizedSection("Magic Items", analysis.magic) +
        renderCategorizedSection("Rare Items", analysis.rare) +
        renderSocketReportingSection() +
        renderMercenaryReportingSection() +
        renderFunFactsSection();

}


/*
 * Sort the filtered list
 */
function sortCharacters() {

    const sort =
        document.getElementById("sort").value;

    filteredCharacters.sort((a, b) => {

        const nameA =
            String(
                a.Name ??
                ""
            );

        const nameB =
            String(
                b.Name ??
                ""
            );

        const levelA =
            Number(
                a.Stats.Level ??
                0
            );

        const levelB =
            Number(
                b.Stats.Level ??
                0
            );


        switch (sort) {

            case "level-desc":
                return levelB - levelA;

            case "level-asc":
                return levelA - levelB;

            case "name":
            default:
                return nameA.localeCompare(nameB);

        }

    });

}


/*
 * Render the table
 */
function renderCharacters() {

    console.time("Render");

    const tbody =
        document.getElementById("characterTable");

    const resultCount =
        document.getElementById("resultCount");

    resultCount.textContent =
        filteredCharacters.length.toLocaleString();


    /*
     * For the initial test, only render the first
     * 500 rows. This prevents accidentally trying
     * to create thousands of DOM nodes at once.
     */
    const charactersToRender =
        filteredCharacters.slice(0, 500);


    tbody.innerHTML = "";


    const fragment =
        document.createDocumentFragment();


    for (const character of charactersToRender) {

        const name =
            character.Name ??
            "(unknown)";

        const level =
            character.Stats.Level ??
            "";


        const className =
            character.Class ??
            character.ClassName ??
            character.CharClass ??
            "${chosenClass}";


        const cluster =
            character.Cluster ??
            character.BuildCluster ??
            "";


        const row =
            document.createElement("tr");


        row.innerHTML = `
            <td>
                <span class="character-name">
                    ${escapeHtml(String(name))}
                </span>
            </td>

            <td>
                ${escapeHtml(String(level))}
            </td>

            <td>
                ${escapeHtml(String(className))}
            </td>

            <td>
                ${escapeHtml(String(cluster))}
            </td>
        `;


        row.querySelector(".character-name")
            .addEventListener("click", () => {
                showCharacter(character);
            });


        fragment.appendChild(row);

    }


    tbody.appendChild(fragment);

    console.timeEnd("Render");


    if (filteredCharacters.length > 500) {

        const row =
            document.createElement("tr");

        row.innerHTML = `
            <td colspan="4">
                Showing first 500 of
                ${filteredCharacters.length.toLocaleString()}
                characters.
            </td>
        `;

        tbody.appendChild(row);

    }

}


/*
 * Show the complete character object
 */
function showCharacter(character) {

    const name =
        character.name ??
        character.character ??
        character.charname ??
        "Character";


    document.getElementById("detailsName")
        .textContent = name;


    document.getElementById("detailsData")
        .textContent =
            JSON.stringify(character, null, 2);


    document.getElementById("characterDetails")
        .style.display = "block";


    document.getElementById("characterDetails")
        .scrollIntoView({
            behavior: "smooth"
        });

}


/*
 * Basic HTML escaping
 */
function escapeHtml(value) {

    return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}
