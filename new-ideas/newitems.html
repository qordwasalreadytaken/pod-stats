// Armory pop up
document.addEventListener("DOMContentLoaded", function () {
    let activePopup = null;

    document.addEventListener("click", function (event) {

        const trigger = event.target.closest(".hover-trigger");

        if (!trigger) {
            return;
        }

        console.log("Trigger clicked");

        event.stopPropagation();

        const characterName = trigger.getAttribute("data-character-name");

        // Find the associated popup
        const popup = trigger
            .closest(".character-info")
            .querySelector(".popup");

        // If this popup is already active, close it
        if (popup === activePopup) {
            popup.classList.remove("active");
            popup.innerHTML = "";
            activePopup = null;
            return;
        }

        // Close any other open popup
        if (activePopup) {
            activePopup.classList.remove("active");
            activePopup.innerHTML = "";
            activePopup = null;
        }

        // Create iframe
        const iframe = document.createElement("iframe");

        iframe.src = `../armory/video_component.html?charName=${characterName}`;
        iframe.setAttribute("id", "popupFrame");

        popup.appendChild(iframe);
        popup.classList.add("active");

        activePopup = popup;
    });

    // Close popup when clicking outside
    document.addEventListener("click", function (event) {

        if (
            activePopup &&
            !event.target.closest(".character-info")
        ) {
            activePopup.classList.remove("active");
            activePopup.innerHTML = "";
            activePopup = null;
        }
    });
});

/*
 * Collapsible button/content pattern matching the site's existing
 * pages (icons swap, .content toggles display).
 */
function toggleCollapsible(button) {

    const content = button.nextElementSibling;
    if (!content) return;

    const collapsedIcon = button.querySelector(".icon-collapsed");
    const expandedIcon = button.querySelector(".icon-expanded");
    const isCollapsed = content.style.display === "none" || content.style.display === "";

    content.style.display = isCollapsed ? "block" : "none";

    if (collapsedIcon && expandedIcon) {
        collapsedIcon.classList.toggle("hidden", isCollapsed);
        expandedIcon.classList.toggle("hidden", !isCollapsed);
    }

}

/*
 * Item/equipment/skill/mercenary formatting, matching
 * ClassPagesAnalyzer._load_skill_data / map_readable_names in class_pages.py
 */

const WORN_CATEGORY_MAP = {
    ring1: "Ring", ring2: "Ring",
    sweapon1: "Left hand Swap", weapon1: "Left hand",
    sweapon2: "Right hand Swap", weapon2: "Right Hand",
    body: "Armor", gloves: "Gloves", belt: "Belt",
    helmet: "Helmet", boots: "Boots", amulet: "Amulet"
};

const QUALITY_COLORS = {
    q_runeword: "#edcd74", q_unique: "#edcd74", q_set: "#45a823",
    q_magic: "#7074c9", q_rare: "yellow", q_crafted: "orange",
    q_normal: "white", q_superior: "white"
};


function coloredItemTitle(item) {

    const qualityCode = item.QualityCode || "default";
    const color = QUALITY_COLORS[qualityCode] || "white";

    if (["q_magic", "q_rare", "q_crafted"].includes(qualityCode)) {
        const tag = item.Tag || "";
        const label = qualityCode.split("_")[1];
        const capitalized = label.charAt(0).toUpperCase() + label.slice(1);
        return `<span style="color: ${color};">${capitalized}${tag ? " " + escapeHtml(tag) : ""}</span>`;
    }

    return `<span style="color: ${color};">${escapeHtml(item.Title || "Unknown")}</span>`;

}


/*
 * Map of slot -> Map(itemHtml -> count) for one character's Equipped list
 */
function buildEquipmentBySlot(character) {

    const bySlot = new Map();

    for (const item of character.Equipped || []) {

        const worn = item.Worn || "Unknown";
        const slot = WORN_CATEGORY_MAP[worn] || worn;
        const html = coloredItemTitle(item);

        if (!bySlot.has(slot)) {
            bySlot.set(slot, new Map());
        }

        const counts = bySlot.get(slot);
        counts.set(html, (counts.get(html) || 0) + 1);

    }

    return bySlot;

}


function buildEquipmentHtml(character) {

    const bySlot = buildEquipmentBySlot(character);
    const parts = [];

    for (const [slot, counts] of bySlot) {
        for (const [html, count] of counts) {
            parts.push(`${slot}: ${html}${count > 1 ? ` x${count}` : ""}`);
        }
    }

    return parts.join(", ") || "No equipment data";

}



/*
 * Aggregate equipment across every member of a cluster, matching
 * class_pages.py's _generate_cluster_equipment_html output shape.
 */
function buildClusterEquipmentSummary(members) {

    const bySlot = new Map();

    for (const member of members) {

        const memberSlots = buildEquipmentBySlot(member.character);

        for (const [slot, counts] of memberSlots) {

            if (!bySlot.has(slot)) {
                bySlot.set(slot, new Map());
            }

            const clusterCounts = bySlot.get(slot);

            for (const [html, count] of counts) {
                clusterCounts.set(html, (clusterCounts.get(html) || 0) + count);
            }

        }

    }

    return bySlot;

}


function renderClusterEquipmentHtml(members) {

    const bySlot = buildClusterEquipmentSummary(members);
    const total = members.length;

    let html = "";

    for (const [slot, counts] of bySlot) {

        const sorted =
            Array.from(counts.entries())
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

        html += `<strong>${escapeHtml(slot)}</strong>: <br>`;

        for (const [itemHtml, count] of sorted) {
            const percentage = total > 0 ? (count / total) * 100 : 0;
            html += `&nbsp;&nbsp;&nbsp;&nbsp;${itemHtml} ${percentage.toFixed(2)}% (${count})<br>`;
        }

    }

    return html || "No equipment data";

}



/*
 * Global item reporting: runewords, uniques, sets, synth, crafted,
 * magic, and rare items, matching class_pages.py's
 * _analyze_equipment_patterns / _process_all_characters* methods.
 */

const CRAFT_CATEGORIES = [
    "Rings", "Weapons and Shields", "Arrows and Bolts",
    "Body Armor", "Gloves", "Belts", "Helmets", "Boots", "Amulets"
];


function categorizeWornSlot(worn, textTag) {

    if (worn === "ring1" || worn === "ring2") {
        return "Rings";
    }

    if (["sweapon1", "weapon1", "sweapon2", "weapon2"].includes(worn)) {
        if (textTag === "Arrow") return "Arrows";
        if (textTag === "Bolt") return "Bolts";
        return "Arrows and Bolts";
    }

    const slotMap = {
        body: "Body Armor", gloves: "Gloves", belt: "Belts",
        helmet: "Helmets", boots: "Boots", amulet: "Amulets"
    };

    return slotMap[worn] || "Weapons and Shields";

}


function addUser(counterMap, key, character, base) {

    if (!counterMap.has(key)) {
        counterMap.set(key, { count: 0, users: [] });
    }

    const entry = counterMap.get(key);
    entry.count++;
    entry.users.push({
        name: character.Name || "Unknown",
        level: character.Stats?.Level ?? "Unknown",
        base: base || null
    });

}


function addCategorizedUser(categoryMap, category, key, character) {

    if (!categoryMap.has(category)) {
        categoryMap.set(category, new Map());
    }

    addUser(categoryMap.get(category), key, character);

}


function computeEquipmentAnalysis(charactersToAnalyze) {

    const runewords = new Map();
    const uniques = new Map();
    const sets = new Map();
    const synth = new Map();
    const synthSources = new Map();
    const crafted = new Map();
    const magic = new Map();
    const rare = new Map();

    for (const character of charactersToAnalyze) {
        for (const item of character.Equipped || []) {

            const title = item.Title || "Unknown Item";
            const qualityCode = item.QualityCode || "default";
            const worn = item.Worn || "Unknown";
            const textTag = item.TextTag || "";
            const tag = item.Tag || "";
            const category = categorizeWornSlot(worn, textTag);

            if (qualityCode === "q_runeword") {
                addUser(runewords, title, character, item.Tag || "Unknown base");
            } else if (qualityCode === "q_unique") {
                addUser(uniques, title, character);
            } else if (qualityCode === "q_set") {
                addUser(sets, title, character);
            }

            if (tag.toLowerCase().includes("synth") || textTag.toLowerCase().includes("synth")) {
                addUser(synth, title, character);

                const synthesizedFrom = item.SynthesisedFrom || [];
                const allRelatedItems = [title, ...synthesizedFrom];

                for (const sourceItem of allRelatedItems) {
                    if (!synthSources.has(sourceItem)) {
                        synthSources.set(sourceItem, []);
                    }
                    synthSources.get(sourceItem).push({
                        name: character.Name || "Unknown",
                        level: character.Stats?.Level ?? "Unknown",
                        synthesizedItem: title
                    });
                }
            } else if (qualityCode === "q_crafted") {
                addCategorizedUser(crafted, category, title, character);
            } else if (qualityCode === "q_magic") {
                addCategorizedUser(magic, category, title, character);
            } else if (qualityCode === "q_rare") {
                addCategorizedUser(rare, category, title, character);
            }

        }
    }

    return { runewords, uniques, sets, synth, synthSources, crafted, magic, rare };

}


/*
 * Socket reporting: what people put into sockets, matching
 * class_pages.py's _socket_html / count_items_by_type.
 */

const RUNE_NAMES = new Set([
    "El Rune", "Eld Rune", "Tir Rune", "Nef Rune", "Eth Rune", "Ith Rune", "Tal Rune", "Ral Rune", "Ort Rune", "Thul Rune", "Amn Rune", "Sol Rune",
    "Shael Rune", "Dol Rune", "Hel Rune", "Io Rune", "Lum Rune", "Ko Rune", "Fal Rune", "Lem Rune", "Pul Rune", "Um Rune", "Mal Rune", "Ist Rune",
    "Gul Rune", "Vex Rune", "Ohm Rune", "Lo Rune", "Sur Rune", "Ber Rune", "Jah Rune", "Cham Rune", "Zod Rune"
]);


function countSocketablesByType(items) {

    const runeCounter = new Map();
    const nonRuneCounter = new Map();
    const magicJewel = { "Misc. Magic Jewels": 0, splash: 0, "attack speed": 0, "enhanced damage": 0, iassplash: 0, iased: 0 };
    const rareJewel = { "Misc. Rare Jewels": 0, splash: 0, "enhanced damage": 0 };
    const facetCounter = new Map();

    for (const item of items) {

        const title = item.Title || "Unknown";
        const quality = item.QualityCode || "";
        const properties = item.PropertyList || [];

        if (RUNE_NAMES.has(title)) {

            runeCounter.set(title, (runeCounter.get(title) || 0) + 1);

        } else if (title.includes("Rainbow Facet")) {

            const elementTypes = ["fire", "cold", "lightning", "poison", "physical", "magic"];
            let element = "Unknown";

            outer:
            for (const elem of elementTypes) {
                for (const prop of properties) {
                    if (String(prop).toLowerCase().includes(elem)) {
                        element = elem.charAt(0).toUpperCase() + elem.slice(1);
                        break outer;
                    }
                }
            }

            if (!facetCounter.has(element)) {
                facetCounter.set(element, { count: 0, perfect: 0 });
            }

            const facet = facetCounter.get(element);
            facet.count++;

            const propText = properties.join(" ");
            if (propText.includes("+5%") && propText.includes("-5%")) {
                facet.perfect++;
            }

        } else if (quality === "q_magic") {

            magicJewel["Misc. Magic Jewels"]++;

            for (const prop of properties) {
                const propText = String(prop).toLowerCase();
                if (propText.includes("splash")) {
                    magicJewel.splash++;
                } else if (propText.includes("attack speed") || propText.includes("ias")) {
                    magicJewel["attack speed"]++;
                } else if (propText.includes("enhanced damage")) {
                    magicJewel["enhanced damage"]++;
                }
            }

            const hasIas = properties.some(prop => {
                const p = String(prop).toLowerCase();
                return p.includes("attack speed") || p.includes("ias");
            });
            const hasSplash = properties.some(prop => String(prop).toLowerCase().includes("splash"));
            const hasEd = properties.some(prop => String(prop).toLowerCase().includes("enhanced damage"));

            if (hasIas && hasSplash) magicJewel.iassplash++;
            if (hasIas && hasEd) magicJewel.iased++;

        } else if (quality === "q_rare") {

            rareJewel["Misc. Rare Jewels"]++;

            for (const prop of properties) {
                const propText = String(prop).toLowerCase();
                if (propText.includes("splash")) {
                    rareJewel.splash++;
                } else if (propText.includes("enhanced damage")) {
                    rareJewel["enhanced damage"]++;
                }
            }

        } else {

            nonRuneCounter.set(title, (nonRuneCounter.get(title) || 0) + 1);

        }

    }

    return { runeCounter, nonRuneCounter, magicJewel, rareJewel, facetCounter };

}


function computeSocketAnalysis(charactersToAnalyze) {

    const justSocketed = [];
    const justSocketedExcludingRunewords = [];

    for (const character of charactersToAnalyze) {
        for (const item of character.Equipped || []) {

            const socketables = item.Sockets || [];
            if (socketables.length === 0) continue;

            const isRuneword = item.QualityCode === "q_runeword";

            for (const socketed of socketables) {
                justSocketed.push(socketed);
                if (!isRuneword) {
                    justSocketedExcludingRunewords.push(socketed);
                }
            }

        }
    }

    return {
        all: countSocketablesByType(justSocketed),
        excluding: countSocketablesByType(justSocketedExcludingRunewords)
    };

}


function sortMapDesc(map) {
    return Array.from(map.entries()).sort((a, b) => b[1] - a[1]);
}


function renderRuneList(runeCounter) {

    const sorted = sortMapDesc(runeCounter);

    if (sorted.length === 0) {
        return "<p>No runes found.</p>";
    }

    return `<ul>${sorted.map(([name, count]) => `<li>${escapeHtml(name)}: ${count}</li>`).join("")}</ul>`;

}


function renderOtherSocketedItems(result) {

    const parts = [];

    for (const [title, count] of sortMapDesc(result.nonRuneCounter)) {
        parts.push(`${escapeHtml(title)}: ${count}`);
    }

    const magicJewel = result.magicJewel;
    parts.push(`Misc. Magic Jewels: ${magicJewel["Misc. Magic Jewels"]} (${magicJewel.splash} Splash, ${magicJewel["attack speed"]} IAS, ${magicJewel["enhanced damage"]} ED; ${magicJewel.iassplash} IAS/Splash, ${magicJewel.iased} IAS/ED)`);

    const rareJewel = result.rareJewel;
    parts.push(`Misc. Rare Jewels: ${rareJewel["Misc. Rare Jewels"]} (${rareJewel.splash} Splash, ${rareJewel["enhanced damage"]} ED)`);

    for (const [element, counts] of result.facetCounter) {
        parts.push(`Rainbow Facet (${escapeHtml(element)}): ${counts.count} (${counts.perfect} Perfect)`);
    }

    return `<ul>${parts.map(part => `<li>${part}</li>`).join("")}</ul>`;

}


function renderSocketReportingSection() {

    const analysis = computeSocketAnalysis(filteredCharacters);

    const contentHtml = `
        <div class="item-report-columns">
            <div>
                <h4>Most Common Runes (Including Runewords)</h4>
                ${renderRuneList(analysis.all.runeCounter)}
            </div>
            <div>
                <h4>Most Common Runes (Excluding Runewords)</h4>
                ${renderRuneList(analysis.excluding.runeCounter)}
            </div>
        </div>
        <h4>Other Items Found in Sockets</h4>
        ${renderOtherSocketedItems(analysis.excluding)}
    `;

    return `
        ${renderSectionHeading("Socketable Reporting")}
        <p>What are people putting in sockets</p>
        ${bigCollapsible("Special", "sets-button", contentHtml)}
    `;

const fullSetItemToCode = new Map();
const fullSetCodeMeta = new Map();

function loadFullSetMetadata() {

    const codeToItems = new Map();

    for (const item of highLevelSets) {

        const itemName = item.name;
        const setCode = item.set;

        if (!itemName || !setCode) {
            continue;
        }

        fullSetItemToCode.set(
            itemName,
            setCode
        );

        if (!codeToItems.has(setCode)) {
            codeToItems.set(
                setCode,
                []
            );
        }

        codeToItems.get(setCode).push(itemName);

    }


    for (const [setCode, items] of codeToItems) {

        fullSetCodeMeta.set(setCode, {

            totalPieces:
                new Set(items).size,

            /*
             * For now, use the set code.
             * We can improve the display name
             * separately.
             */
            displayName:
                inferSetDisplayName(setCode, items)

        });

    }

}

function inferSetDisplayName(
    setCode,
    firstItemName
) {

    if (firstItemName.includes("'")) {

        const parts =
            firstItemName.split(" ");

        const collected = [];

        for (const part of parts) {

            collected.push(part);

            if (part.includes("'")) {
                break;
            }

        }

        if (collected.length > 0) {
            return collected.join(" ");
        }

    }

    return setCode;

}


function findFullSetWearers(charactersToAnalyze) {

    const fullSets =
        new Map();


    for (const character of charactersToAnalyze) {

        /*
         * Track which pieces of each set
         * this character is wearing.
         */
        const wornSetPieces =
            new Map();


        for (
            const item of
            character.Equipped ?? []
        ) {

            const title =
                item.Title;

            if (!title) {
                continue;
            }


            const setCode =
                fullSetItemToCode.get(title);

            if (!setCode) {
                continue;
            }


            if (!wornSetPieces.has(setCode)) {

                wornSetPieces.set(
                    setCode,
                    new Set()
                );

            }


            wornSetPieces
                .get(setCode)
                .add(title);

        }


        /*
         * Check whether every piece
         * of any set is equipped.
         */
        for (
            const [
                setCode,
                wornPieces
            ]
            of wornSetPieces
        ) {

            const metadata =
                fullSetCodeMeta.get(setCode);

            if (!metadata) {
                continue;
            }


            if (
                wornPieces.size >=
                metadata.totalPieces
            ) {

                if (!fullSets.has(setCode)) {

                    fullSets.set(
                        setCode,
                        {
                            displayName:
                                metadata.displayName,

                            characters: []
                        }
                    );

                }


                fullSets
                    .get(setCode)
                    .characters
                    .push({
                        name:
                            character.Name ??
                            "Unknown",

                        level:
                            character.Stats?.Level ??
                            "Unknown",

                        class:
                            character.Class ??
                            "Unknown"
                    });

            }

        }

    }


    return fullSets;

}

function renderFullSetsSection(fullSets) {

    if (!fullSets || fullSets.size === 0) {
        return "";
    }


    const sortedSets =
        Array.from(fullSets.entries())

    const fullSetsHtml =

async function loadItemsData() {

        await fetch("./data/items_list.json");

    if (!response.ok) {
        throw new Error(
            `Unable to load item data: ${response.status}`
        );
    }

}

function analyzeWeaponLoadouts(charactersToAnalyze) {

    const bowBases = new Set([
        ...(itemsData.zon_bows ?? []),
        ...(itemsData.bow_bows ?? [])
    ].map(base => base.toLowerCase()));

    const xbowBases = new Set(
        (itemsData.cross_bows ?? [])
            .map(base => base.toLowerCase())
    );

    const oneOrTwoHand = new Set(
        (itemsData.one_or_two_hand ?? [])
            .map(base => base.toLowerCase())
    );

    const twoHandedBases = new Set(
        (itemsData.two_handed_bases ?? [])
            .map(base => base.toLowerCase())
    );


    const loadoutCounts = new Map();

    let totalLoadouts = 0;

    let emptyLoadoutCount = 0;
    let partiallyEmptySetCount = 0;


    function increment(category) {

        loadoutCounts.set(
            category,
            (loadoutCounts.get(category) ?? 0) + 1
        );

    }


    function isWeapon(item) {

        return item &&
            "DamageMinimum" in item &&
            "DamageMaximum" in item;

    }


    function isShield(item) {

        return item &&
            "Block" in item &&
            "Defense" in item;

    }


    function classifyLoadout(w1, w2) {

        if (!w1 && !w2) {
            return null;
        }


        const tag1 =
            w1?.Tag?.toLowerCase() ?? "";

        const tag2 =
            w2?.Tag?.toLowerCase() ?? "";

        const tags = [tag1, tag2];


        /*
         * Bow + Arrows
         */

        const hasBow =
            bowBases.has(tag1) ||
            bowBases.has(tag2);

        const hasArrows =
            tags.some(tag =>
                tag.includes("arrow")
            );


        if (hasBow && hasArrows) {
            return "Bow + Arrows";
        }

        if (hasBow) {
            return "Bow Only (Missing Arrows)";
        }

        if (hasArrows) {
            return "Arrows Only (Missing Bow)";
        }


        /*
         * Crossbow + Bolts
         */

        const hasCrossbow =
            xbowBases.has(tag1) ||
            xbowBases.has(tag2);

        const hasBolts =
            tags.some(tag =>
                tag.includes("bolt")
            );


        if (hasCrossbow && hasBolts) {
            return "Crossbow + Bolts";
        }

        if (hasCrossbow) {
            return "Crossbow Only (Missing Bolts)";
        }

        if (hasBolts) {
            return "Bolts Only (Missing Crossbow)";
        }


        /*
         * Two-handed melee weapon
         */

        if (w1 && !w2 && isWeapon(w1)) {

            if (
                oneOrTwoHand.has(tag1) ||
                twoHandedBases.has(tag1)
            ) {
                return "A Single Two-Handed Weapon";
            }

        }


        if (w2 && !w1 && isWeapon(w2)) {

            if (
                oneOrTwoHand.has(tag2) ||
                twoHandedBases.has(tag2)
            ) {
                return "A Single Two-Handed Weapon";
            }

        }


        /*
         * Weapon + Shield
         */

        if (
            (isWeapon(w1) && isShield(w2)) ||
            (isShield(w1) && isWeapon(w2))
        ) {
            return "Weapon + Shield";
        }


        /*
         * Dual wield
         */

        if (
            isWeapon(w1) &&
            isWeapon(w2)
        ) {
            return "Dual Wield";
        }


        /*
         * Single one-handed weapon
         */

        if (
            w1 &&
            !w2 &&
            isWeapon(w1)
        ) {

            if (
                !oneOrTwoHand.has(tag1) &&
                !twoHandedBases.has(tag1)
            ) {
                return "Single One-Handed Weapon (Missing Shield or Second Weapon)";
            }

        }


        if (
            w2 &&
            !w1 &&
            isWeapon(w2)
        ) {

            if (
                !oneOrTwoHand.has(tag2) &&
                !twoHandedBases.has(tag2)
            ) {
                return "Single One-Handed Weapon (Missing Shield or Second Weapon)";
            }

        }


        /*
         * Shield only
         */

        if (
            (isShield(w1) && !w2) ||
            (isShield(w2) && !w1)
        ) {
            return "Shield Only (Missing Weapon)";
        }


        return "Other";

    }


    /*
     * Analyze every character
     */

    for (const character of charactersToAnalyze) {

        const equipped = {};


        for (const item of character.Equipped ?? []) {

            if (
                item &&
                item.Worn
            ) {
                equipped[item.Worn] = item;
            }

        }


        const hasSet1 =
            equipped.weapon1 ||
            equipped.weapon2;

        const hasSet2 =
            equipped.sweapon1 ||
            equipped.sweapon2;


        /*
         * Count completely missing loadouts.
         */

        if (!hasSet1 && !hasSet2) {

            emptyLoadoutCount++;

        } else if (!hasSet1 || !hasSet2) {

            partiallyEmptySetCount++;

        }


        let setsCategorized = 0;


        const weaponSets = [
            ["weapon1", "weapon2"],
            ["sweapon1", "sweapon2"]
        ];


        for (const [slot1, slot2] of weaponSets) {

            const w1 =
                equipped[slot1];

            const w2 =
                equipped[slot2];


            const category =
                classifyLoadout(w1, w2);


            if (category) {

                increment(category);

                totalLoadouts++;

                setsCategorized++;

            }

        }


        /*
         * This mirrors your Python logic.
         */

        if (setsCategorized === 0) {

            emptyLoadoutCount++;

        }

    }


    return {

        loadoutCounts,

        totalLoadouts,

        emptyLoadoutCount,

        partiallyEmptySetCount

    };

}

/*
Start unused items
*/
function analyzeUnusedItems(charactersToAnalyze) {

    /*
     * All items actually used by characters.
     */
    const playerUsedItems = new Set();

    /*
     * All items used by mercenaries.
     */
    const mercUsedItems = new Set();

    /*
     * Maps item name -> characters whose mercenary uses it.
     */
    const mercUsers = new Map();


    function normalizeItemName(name) {

        return String(name ?? "")
            .trim()
            .toLowerCase();

    }


    /*
     * Check player equipment.
     */
    for (const character of charactersToAnalyze) {

        for (const item of character.Equipped ?? []) {

            const name =
                normalizeItemName(item.Title);

            if (name) {
                playerUsedItems.add(name);
            }

        }

    }


    /*
     * Check mercenary equipment.
     */
    for (const character of charactersToAnalyze) {

        for (const item of character.MercenaryEquipped ?? []) {

            const name =
                normalizeItemName(item.Title);

            if (!name) {
                continue;
            }


            mercUsedItems.add(name);


            if (!mercUsers.has(name)) {
                mercUsers.set(name, []);
            }


            mercUsers.get(name).push({

                Name:
                    character.Name ??
                    "Unknown",

                Level:
                    character.Stats?.Level ??
                    "Unknown",

                Class:
                    character.Class ??
                    "Unknown"

            });

        }

    }


    const allRunewords =
        new Set(
            (itemsData.all_the_runewords ?? [])
                .map(normalizeItemName)
        );

    const allUniques =
        new Set(
            (itemsData.all_the_uniques ?? [])
                .map(normalizeItemName)
        );

    const allSetItems =
        new Set(
            (itemsData.all_the_sets ?? [])
                .map(normalizeItemName)
        );


    /*
     * An item is "unused" if no player is using it.
     *
     * We intentionally do NOT subtract mercUsedItems here,
     * because we still want to display items that are
     * "only used on mercenaries".
     */

    function findUnused(allItems) {

        return new Set(
            [...allItems]
                .filter(item =>
                    !playerUsedItems.has(item)
                )
        );

    }


    return {

        unusedRunewords:
            findUnused(allRunewords),

        unusedUniques:
            findUnused(allUniques),

        unusedSetItems:
            findUnused(allSetItems),

        mercUsedItems,

        mercUsers

    };

}

function escapeHtml(value) {

    return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

//Anchor in place fix
// Expand collapsibles and scroll to anchor
function scrollWithOffset(el, offset = -50) {
    const y = el.getBoundingClientRect().top + window.pageYOffset + offset;
    window.scrollTo({ top: y, behavior: 'smooth' });
}

function expandToAnchor(anchorId) {
    console.log("expandToAnchor called with:", anchorId);
    const target = document.getElementById(anchorId);
    if (!target) return;

    // Step 1: Collect all parent .content elements that need expanding
    const stack = [];
    let el = target;
    while (el) {
        if (el.classList?.contains('content')) {
            stack.unshift(el); // add to beginning to expand outermost first
        }
        el = el.parentElement;
    }

    // Step 2: Expand each .content section in order
    for (const content of stack) {
        const button = content.previousElementSibling;
        if (button?.classList.contains('collapsible')) {
            button.classList.add('active');
            content.style.display = "block";

            const openIcon = button.querySelector("img.open-icon");
            const closeIcon = button.querySelector("img.close-icon");
            if (openIcon) openIcon.classList.add("hidden");
            if (closeIcon) closeIcon.classList.remove("hidden");
        }
    }

    // Step 3: Delay scroll until DOM has reflowed
    setTimeout(() => {
        console.log("scrolling to:", target.id);
        scrollWithOffset(target);
    }, 250); // Adjust if necessary
}

// Handle clicks on .anchor-link elements
document.addEventListener('DOMContentLoaded', () => {
    // Handle clicks on .anchor-link elements
    document.querySelectorAll('.anchor-link, a[href^="#"]').forEach(link => {
        link.addEventListener('click', function (event) {
            event.preventDefault(); // Prevent default anchor behavior
            const anchorId = this.getAttribute('href').substring(1);
            const fullUrl = `${window.location.origin}${window.location.pathname}#${anchorId}`;

            navigator.clipboard.writeText(fullUrl); // Copy full link to clipboard
            history.pushState(null, '', `#${anchorId}`); // Update URL without page reload
            expandToAnchor(anchorId); // Expand and scroll
        });
    });

    // On initial load with hash
    if (window.location.hash) {
        const anchorId = window.location.hash.substring(1);
        // Wait a bit for collapsibles/content to render
    setTimeout(() => {
        console.log("Looking for anchor:", anchorId);
        console.log("Found:", document.getElementById(anchorId));
        expandToAnchor(anchorId);
    }, 3000);
    }
});
