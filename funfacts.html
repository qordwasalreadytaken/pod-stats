// Armory pop up
document.addEventListener("DOMContentLoaded", function () {
    let activePopup = null;

    document.addEventListener("click", function (event) {

        const trigger = event.target.closest(".hover-trigger");

        if (!trigger) {
            return;
        }

        event.stopPropagation();

        const characterName = trigger.getAttribute("data-character-name");

        const popup = trigger
            .closest(".character-info")
            .querySelector(".popup");

        if (popup === activePopup) {
            popup.classList.remove("active");
            popup.innerHTML = "";
            activePopup = null;
            return;
        }

        if (activePopup) {
            activePopup.classList.remove("active");
            activePopup.innerHTML = "";
            activePopup = null;
        }

        const iframe = document.createElement("iframe");

        iframe.src = `./armory/video_component.html?charName=${characterName}`;
        iframe.setAttribute("id", "popupFrame");

        popup.appendChild(iframe);
        popup.classList.add("active");

        activePopup = popup;
    });

    document.addEventListener("click", function (event) {

        if (
            activePopup &&
            !event.target.closest(".character-info")
        ) {
            activePopup.classList.remove("active");
            activePopup.innerHTML = "";
            activePopup = null;
        }
    });
});

    document.querySelector(".top-buttons").classList.toggle("show");
}

function topFunction() {
    document.body.scrollTop = 0;
    document.documentElement.scrollTop = 0;
}

function renderSectionHeading(heading) {

            </a>
        </h3>
    `;
}

function toggleCollapsible(button) {

    const content = button.nextElementSibling;
    if (!content) return;

    const collapsedIcon = button.querySelector(".icon-collapsed");
    const expandedIcon = button.querySelector(".icon-expanded");
    const isCollapsed = content.style.display === "none" || content.style.display === "";

    content.style.display = isCollapsed ? "block" : "none";

    if (collapsedIcon && expandedIcon) {
        collapsedIcon.classList.toggle("hidden", isCollapsed);
        expandedIcon.classList.toggle("hidden", !isCollapsed);
    }

}

function bigCollapsible(iconBaseName, extraClass, contentHtml) {

    return `
        <button type="button" class="collapsible ${extraClass}" onclick="toggleCollapsible(this)">
            <img src="./icons/${iconBaseName}_click.png" alt="Open" class="icon icon-expanded hidden">
            <img src="./icons/${iconBaseName}.png" alt="Close" class="icon icon-collapsed">
        </button>
        <div class="content" style="display: none;">${contentHtml}</div>
    `;

}

function smallCollapsible(labelHtml, contentHtml) {

    return `
        <button type="button" class="collapsible small-collapsible" onclick="toggleCollapsible(this)">
            <img src="./icons/open.png" alt="Open" class="icon-small icon-expanded hidden">
            <img src="./icons/closed.png" alt="Close" class="icon-small icon-collapsed">
            <strong>${labelHtml}</strong>
        </button>

}

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

/*
 * Top 1,000 class distribution pie chart. Always uses the fixed top-1000
 * ladder snapshot (jsons/{mode}-top1k.json) and ignores the level filters,
 * matching the site-wide "top 1k" pie chart on home.html.
 */
async function loadTop1kPieChart(mode) {

    try {

        const response = await fetch(
            mode === "sc" ? "jsons/sc-top1k.json" : "jsons/hc-top1k.json"
        );

        const top1k = await response.json();

        const classCounts = new Map();

        for (const char of top1k) {
            const className = char.class || "Unknown";
            classCounts.set(className, (classCounts.get(className) || 0) + 1);
        }

        const total = top1k.length;

        const pieData = [...classCounts.entries()].map(([className, count]) => ({
            className,
            count
        }));

        renderClassDistributionPieChart(pieData, total, mode === "hc" ? "HC" : "SC");

    } catch (error) {
        console.error("Error generating top 1k class distribution:", error);
    }
}

function renderClassDistributionPieChart(pieData, total, modeLabel) {

    const chart = document.getElementById("classDistributionChart");

    if (!chart || !pieData.length) {
        return;
    }

    const data = [{
        type: "pie",
        values: pieData.map(item => item.count),
        labels: pieData.map(item => item.className),
        customdata: pieData.map(item => [item.className]),
        textinfo: "percent",
        textposition: "inside",
        hovertemplate:
            "<b>" + modeLabel + " %{customdata}</b><br>" +
            "%{value:,} Characters" +
            "<extra></extra>",
        marker: {
            colors: pieData.map(item => CLASS_COLOR_MAP_HEX[item.className] || "#888888"),
            line: { color: "black", width: 1 }
        },
        pull: pieData.map(() => 0.03),
        hole: 0
    }];

    const layout = {
        title: `Class Distribution of the Top ${total.toLocaleString()} ${modeLabel} Ladder Characters`,
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        font: { color: "white" },
        margin: { l: 10, r: 10, t: 50, b: 100 },
        height: 400,
        legend: {
            orientation: "h",
            yanchor: "top",
            y: -0.05,
            xanchor: "center",
            x: 0.5,
            font: { size: 16, color: "white" },
            bgcolor: "rgba(0,0,0,0)"
        }
    };

    Plotly.newPlot(chart, data, layout, { responsive: true });

}

/*
 * Skill-vector build clustering, matching class.html's clusterBuilds()
 * (greedy cosine-similarity clustering), scoped to an arbitrary list of
 * characters so it can be run once per class here.
 */
function getSkillColumnsFor(characterList) {

    const names = new Set();

    for (const character of characterList) {
        for (const tab of character.SkillTabs ?? []) {
            for (const skill of tab.Skills ?? []) {
                names.add(skill.Name);
            }
        }
    }

    return Array.from(names);

}

function buildSkillVectorFor(character, skillColumns) {

    const levels = new Map();

    for (const tab of character.SkillTabs ?? []) {
        for (const skill of tab.Skills ?? []) {
            levels.set(skill.Name, skill.Level);
        }
    }

    return skillColumns.map(name => levels.get(name) ?? 0);

}

function cosineSimilarity(a, b) {

    let dot = 0;
    let normA = 0;
    let normB = 0;

    for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i];
        normA += a[i] * a[i];
        normB += b[i] * b[i];
    }

    if (normA === 0 || normB === 0) {
        return 0;
    }

    return dot / (Math.sqrt(normA) * Math.sqrt(normB));

}

function clusterCharacterList(characterList, threshold) {

    const skillColumns = getSkillColumnsFor(characterList);
    const vectors = characterList.map(character => buildSkillVectorFor(character, skillColumns));

    const n = vectors.length;
    const clusterIndex = new Array(n).fill(-1);

    let clusterId = 0;

    for (let i = 0; i < n; i++) {

        if (clusterIndex[i] !== -1) {
            continue;
        }

        const similarIndices = [];

        for (let j = 0; j < n; j++) {

            if (clusterIndex[j] !== -1) {
                continue;
            }

            if (cosineSimilarity(vectors[i], vectors[j]) >= threshold) {
                similarIndices.push(j);
            }
        }

        if (similarIndices.length > 1) {
            for (const j of similarIndices) {
                clusterIndex[j] = clusterId;
            }
            clusterId++;
        }
    }

    const grouped = new Map();

    for (let i = 0; i < n; i++) {

        if (clusterIndex[i] === -1) {
            continue; // Unassigned singletons aren't a "build"
        }

        const id = clusterIndex[i];

        if (!grouped.has(id)) {
            grouped.set(id, []);
        }

        grouped.get(id).push({ character: characterList[i], vector: vectors[i] });
    }

    return Array.from(grouped.values()).map(members => {

        const averages = skillColumns.map((_, colIndex) =>
            members.reduce((sum, m) => sum + m.vector[colIndex], 0) / members.length
        );

        const topSkills = skillColumns
            .map((name, colIndex) => ({ name, average: averages[colIndex] }))
            .sort((a, b) => b.average - a.average)
            .slice(0, 5);

        return { members, topSkills };

    });

}

/*
 * Top 10 most popular builds across ALL classes: cluster within each class
 * (like class.html), then merge every class's clusters into one list
 * and keep the 10 biggest by player count.
 */
function computeTop10Builds(characters, threshold) {

    const allBuilds = [];

    for (const className of ALL_CLASSES) {

        const classCharacters = characters.filter(character => character.Class === className);

        if (classCharacters.length < 3) {
            continue;
        }

        const clusters = clusterCharacterList(classCharacters, threshold);

        for (const cluster of clusters) {

            const playerCount = cluster.members.length;

            if (playerCount < 3) {
                continue;
            }

            const buildNameSkills = cluster.topSkills
                .filter(skill => skill.average >= 5)
                .slice(0, 3)
                .map(skill => skill.name);

            allBuilds.push({
                class: className,
                buildName: buildNameSkills.length ? buildNameSkills.join(" / ") : "Miscellaneous Build",
                playerCount,
                classPercentage: (playerCount / classCharacters.length) * 100,
                topSkills: cluster.topSkills
            });
        }
    }

    allBuilds.sort((a, b) => b.playerCount - a.playerCount);

    return allBuilds.slice(0, 10);

}

function renderTopBuildsSection(topBuilds) {

    if (!topBuilds.length) {
        return `${renderSectionHeading("Top 10 Most Popular Builds")}<p>No build data available.</p>`;
    }

    const buildsHtml = topBuilds.map((build, index) => {

        const borderColor = CLASS_COLORS[build.class] || "#666";

        const skillsList = build.topSkills
            .filter(skill => skill.average >= 3)
            .map(skill => `${escapeHtml(skill.name)}: ${skill.average.toFixed(1)} avg points`)
            .join("<br>");

        return `
            <div class="build-item" style="background-color: #2a2a2a; margin: 8px 0; padding: 12px; border-radius: 6px; border-left: 3px solid ${borderColor};">
                <h3 style="margin: 0 0 5px 0;">#${index + 1} - ${escapeHtml(build.class)}: ${escapeHtml(build.buildName)}</h3>
                <div style="color: #cccccc; margin-bottom: 5px; font-size: 14px;">
                    <strong>${build.playerCount.toLocaleString()} players</strong> (${build.classPercentage.toFixed(1)}% of all ${escapeHtml(build.class)}s)
                </div>
                <div><strong>Key Skills:</strong><br>${skillsList}</div>
            </div>
            <br>
        `;

    }).join("");

    return `
        ${renderSectionHeading("Top 10 Most Popular Builds")}
        <p>The most popular character builds across all classes, determined by analyzing skill point allocation and build similarity.</p>
        <div class="top-builds-container">${buildsHtml}</div>
    `;

}

function computeUndead(characters) {

    const undead = characters
        .filter(character => character.IsDead === false)
        .map(character => ({
            name: character.Name || "Unknown",
            level: character.Stats?.Level ?? 0,
            class: character.Class || "Unknown"
        }));

    return { count: undead.length, characters: undead };

}

function renderUndeadSection(undeadData) {

        ${smallCollapsible("View Undead Characters", `<div id="undead">${renderCharacterInfoList(undeadData.characters)}</div>`)}
    `;

}

function computeCannotBeFrozen(characters) {

    let cbfAbsentCount = 0;
    const cbfAbsentCharacters = [];

    for (const character of characters) {

        let halfFreezeSources = 0;
        let hasCbf = false;

        for (const item of character.Equipped || []) {

            let itemTagged = false;

            for (const prop of item.PropertyList || []) {
                const propLower = prop.toLowerCase();
                if (propLower.includes("half freeze duration")) {
                    halfFreezeSources++;
                    itemTagged = true;
                    break;
                }
                if (propLower.includes("cannot be frozen")) {
                    hasCbf = true;
                }
            }

            if (!itemTagged) {
                for (const socket of item.Sockets || []) {
                    let socketTagged = false;
                    for (const prop of socket.PropertyList || []) {
                        const propLower = prop.toLowerCase();
                        if (propLower.includes("half freeze duration")) {
                            halfFreezeSources++;
                            socketTagged = true;
                            break;
                        }
                        if (propLower.includes("cannot be frozen")) {
                            hasCbf = true;
                        }
                    }
                    if (socketTagged) break;
                }
            }
        }

        if (halfFreezeSources >= 2 && !hasCbf) {
            cbfAbsentCount++;
            cbfAbsentCharacters.push({
                name: character.Name || "Unknown",
                level: character.Stats?.Level ?? 0,
                class: character.Class || "Unknown"
            });
        }
    }

    return { cbfAbsentCount, cbfAbsentCharacters };

}

function renderCbfSection(cbfData) {

    return `
        ${renderSectionHeading("Cannot Be Frozen Analysis")}
        <h3>${cbfData.cbfAbsentCount.toLocaleString()} Characters achieve Cannot Be Frozen through 2 or more sources of Half Freeze Duration</h3>
        ${smallCollapsible("View Characters with CBF from Multiple Sources of Half Freeze", `<div id="cbf-missing">${renderCharacterInfoList(cbfData.cbfAbsentCharacters)}</div>`)}
    `;

}

const TOP_STATS_TO_TRACK = ["Strength", "Dexterity", "Vitality", "Energy", "Life", "Mana", "MagicFind", "GoldFind"];

function getStatValue(character, statName) {

    if (["Strength", "Dexterity", "Vitality", "Energy", "Life", "Mana"].includes(statName)) {
        return character.Stats?.[statName] ?? 0;
    }

    if (["MagicFind", "GoldFind"].includes(statName)) {
        return character.Bonus?.[statName] ?? 0;
    }

    return character[statName] ?? 0;

}

function computeTopStats(characters) {

    const topStats = {};

    for (const statName of TOP_STATS_TO_TRACK) {

        const sorted = [...characters].sort((a, b) => getStatValue(b, statName) - getStatValue(a, statName));

        topStats[statName] = sorted.slice(0, 5).map(character => ({
            name: character.Name || "Unknown",
            level: character.Stats?.Level ?? 0,
            class: character.Class || "Unknown",
            value: getStatValue(character, statName)
        }));
    }

    return topStats;

}

function renderTopList(statData) {

    return statData.map(char => `
        <div style="color: #ccc; margin: 4px 0;">
            <a href="https://beta.pathofdiablo.com/armory?name=${encodeURIComponent(char.name)}" target="_blank">${escapeHtml(char.name)}</a>
            - Level ${escapeHtml(String(char.level))} ${escapeHtml(char.class)} (${char.value.toLocaleString()})
        </div>
    `).join("");

}

                <div style="margin: 8px 0; padding: 10px; background-color: #1a1a1a; border-radius: 4px;">${renderTopList(topStats.Energy || [])}</div>
            </div>
        </div>

        <div class="fun-facts-row">
            <div class="fun-facts-column">
                <h3>The 5 Characters with the Most Life*:</h3>
                <div style="margin: 8px 0; padding: 10px; background-color: #1a1a1a; border-radius: 4px;">${renderTopList(topStats.Life || [])}</div>
            </div>
            <div class="fun-facts-column">
                <h3>The 5 Characters with the Most Mana*:</h3>
                <div style="margin: 8px 0; padding: 10px; background-color: #1a1a1a; border-radius: 4px;">${renderTopList(topStats.Mana || [])}</div>
            </div>
        </div>
        <em>*"Most" Life and Mana values are from a snapshot in time and may or may not be affected by bonuses from BO, Oak, etc.</em>

        <div class="fun-facts-row">
            <div class="fun-facts-column">
                <h3>The 5 Characters with the Most Magic Find:</h3>

function median(values) {

    if (!values.length) return 0;

    const sorted = [...values].sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);

    return sorted.length % 2 !== 0
        ? sorted[mid]
        : (sorted[mid - 1] + sorted[mid]) / 2;

}

function computeAverages(characters) {

    const mfValues = [];
    const gfValues = [];
    const lifeValues = [];
    const manaValues = [];

    for (const character of characters) {
        mfValues.push(character.Bonus?.MagicFind ?? 0);
        gfValues.push(character.Bonus?.GoldFind ?? 0);
        lifeValues.push(character.Stats?.Life ?? 0);
        manaValues.push(character.Stats?.Mana ?? 0);
    }

    const sum = arr => arr.reduce((total, value) => total + value, 0);
    const count = characters.length || 1;

    return {
        averages: {
            mf: sum(mfValues) / count,
            gf: sum(gfValues) / count,
            life: sum(lifeValues) / count,
            mana: sum(manaValues) / count
        },
        medians: {
            mf: median(mfValues),
            gf: median(gfValues),
            life: median(lifeValues),
            mana: median(manaValues)
        }
    };

}

/*
 * Top account statistics + class ladder dominance, driven entirely by the
 * prebuilt jsons/{mode}-top1k.json and jsons/{mode}-classleaders.json
 * (fresh ranked-ladder snapshots from the API); unaffected by the level
 * filter controls since that filter only applies to the bulk ladder scrape.
 */
function computeTopAccounts(top1k) {

    const levelCounter = new Map();
    const level99Accounts = new Map();
    const accountClassCounts = new Map();
    const accountClassSets = new Map();
    const accountStats = new Map();

    for (const char of top1k) {

        levelCounter.set(char.level, (levelCounter.get(char.level) || 0) + 1);

        if (!char.account) continue;

        if (char.level === 99) {
            level99Accounts.set(char.account, (level99Accounts.get(char.account) || 0) + 1);
        }

        if (!accountClassCounts.has(char.account)) accountClassCounts.set(char.account, new Map());
        const classCounts = accountClassCounts.get(char.account);
        classCounts.set(char.charClass, (classCounts.get(char.charClass) || 0) + 1);

        if (!accountClassSets.has(char.account)) accountClassSets.set(char.account, new Set());
        accountClassSets.get(char.account).add(char.charClass);

        if (!accountStats.has(char.account)) accountStats.set(char.account, { count: 0, levels: 0, xp: 0 });
        const stat = accountStats.get(char.account);
        stat.count++;
        stat.levels += char.level || 0;
        stat.xp += char.exp || 0;
    }

    const top99s = [...level99Accounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3);

    function topAccountsWithClass(classCode, minCount = 2, topN = 5) {
        return [...accountClassCounts.entries()]
            .filter(([, counts]) => (counts.get(classCode) || 0) >= minCount)
            .sort((a, b) => (b[1].get(classCode) || 0) - (a[1].get(classCode) || 0))
            .slice(0, topN)
            .map(([account, counts]) => [account, counts.get(classCode) || 0]);
    }

    const classCodes = Object.keys(CLASS_CODE_TO_NAME);

    const completeClassAccounts = [...accountClassSets.entries()]
        .filter(([, set]) => classCodes.every(code => set.has(code)))
        .map(([account]) => account);

    const sortedByXp = [...accountStats.entries()].sort((a, b) => b[1].xp - a[1].xp).slice(0, 5);
    const sortedByLevels = [...accountStats.entries()].sort((a, b) => b[1].levels - a[1].levels).slice(0, 5);
    const sortedByCount = [...accountStats.entries()].sort((a, b) => b[1].count - a[1].count).slice(0, 10);

    return {
        levelCounter,
        top99s,
        mostByClass: {
            ama: topAccountsWithClass("ama"),
            asn: topAccountsWithClass("asn"),
            bar: topAccountsWithClass("bar"),
            dru: topAccountsWithClass("dru"),
            nec: topAccountsWithClass("nec"),
            pal: topAccountsWithClass("pal"),
            sor: topAccountsWithClass("sor")
        },
        completeClassAccounts,
        sortedByXp,
        sortedByLevels,
        sortedByCount
    };

}

function computeClassDominance(classLeaders) {

    const sections = [];

    for (const className of ALL_CLASSES) {

        const chars = classLeaders[className] || [];
        const byAccount = new Map();

        for (const char of chars) {
            const account = char.account || "Unknown";
            if (!byAccount.has(account)) byAccount.set(account, []);
            byAccount.get(account).push(char);
        }

        const sorted = [...byAccount.entries()]
            .filter(([, list]) => list.length >= 2)
            .sort((a, b) =>
                b[1].length - a[1].length ||
                Math.min(...a[1].map(c => c.rank)) - Math.min(...b[1].map(c => c.rank))
            );

        if (sorted.length) {
            sections.push({ className, accounts: sorted });
        }
    }

    return sections;

}

/*
 * Data loading and filtering
 */

let allCharacters = [];
let top1kRecords = [];
let classLeaders = {};

async function loadFunFactsData() {

    const mode = document.getElementById("mode").value;

    const [charactersResponse, top1kResponse, classLeadersResponse] = await Promise.all([
        fetch(mode === "sc" ? "jsons/sc-funfacts.json" : "jsons/hc-funfacts.json"),
        fetch(mode === "sc" ? "jsons/sc-top1k.json" : "jsons/hc-top1k.json"),
        fetch(mode === "sc" ? "jsons/sc-classleaders.json" : "jsons/hc-classleaders.json")
    ]);

    allCharacters = await charactersResponse.json();
    top1kRecords = await top1kResponse.json();
    classLeaders = await classLeadersResponse.json();

    loadTop1kPieChart(mode);
    applyFilters();

}

function applyFilters() {

    console.time("Filter");

    const minLevelValue = document.getElementById("minLevel").value;
    const maxLevelValue = document.getElementById("maxLevel").value;
    const threshold = Number(document.getElementById("threshold").value) || 0.6;

    const minLevel = minLevelValue === "" ? null : Number(minLevelValue);
    const maxLevel = maxLevelValue === "" ? null : Number(maxLevelValue);

    const filteredCharacters = allCharacters.filter(character => {

        const level = Number(character.Stats?.Level ?? 0);

        if (minLevel !== null && level < minLevel) return false;
        if (maxLevel !== null && level > maxLevel) return false;

        return true;

    });

    console.timeEnd("Filter");

    renderFunFactsReport(filteredCharacters, threshold);

    if (window.location.hash) {
        const anchorId = decodeURIComponent(window.location.hash.substring(1));
        setTimeout(() => { expandToAnchor(anchorId); }, 50);
    }

    const status = document.getElementById("status");
    status.innerHTML = `Loaded <strong>${filteredCharacters.length.toLocaleString()}</strong> characters.`;

}

function renderFunFactsReport(filteredCharacters, threshold) {

    const reportGrid = document.getElementById("funFactsReportGrid");

    const topBuilds = computeTop10Builds(filteredCharacters, threshold);
    const accountsData = computeTopAccounts(top1kRecords);
    const dominanceSections = computeClassDominance(classLeaders);
    const undeadData = computeUndead(filteredCharacters);
    const cbfData = computeCannotBeFrozen(filteredCharacters);
    const topStats = computeTopStats(filteredCharacters);
    const { averages, medians } = computeAverages(filteredCharacters);

    reportGrid.innerHTML = `
        ${renderSectionHeading("Top 1,000 Ladder Class Distribution")}
        <h4>Looking at the class distribution for the ladder's top 1,000 characters shows which classes are played for longer, a measure of which classes are more popular in the endgame. This always reflects the top 1,000 regardless of the level filter above.</h4>
        <div class="chart-container" id="classDistributionChart"></div>

        <hr>

        ${renderSectionHeading("Ladder Statistics Overview")}
        <div class="fun-facts-row">
            <div class="fun-facts-column">
                <h3>Total Characters Analyzed: ${filteredCharacters.length.toLocaleString()}</h3>
                <p>The analysis below includes data from all ranked ladder characters matching the current level filter</p>
            </div>
        </div>

        <hr>

        ${renderTopBuildsSection(topBuilds)}

        <hr>

        ${renderTopAccountsSection(accountsData, dominanceSections)}

        <hr>

        ${renderUndeadSection(undeadData)}

        <hr>

        ${renderCbfSection(cbfData)}

        <hr>

        ${renderTopStatsSection(topStats)}

        <hr>

        ${renderAveragesSection(averages, medians)}
    `;

    loadTop1kPieChart(document.getElementById("mode").value);

}

 * Event handlers

document

document

            scHcButton.style.backgroundImage = "url('./icons/Softcore_click.png')";
        }

    }

});

//Anchor in place fix
function scrollWithOffset(el, offset = -50) {
    const y = el.getBoundingClientRect().top + window.pageYOffset + offset;
    window.scrollTo({ top: y, behavior: 'smooth' });
}

function expandToAnchor(anchorId) {

    const target = document.getElementById(anchorId);
    if (!target) return;

    const stack = [];
    let el = target;
    while (el) {
        if (el.classList?.contains('content')) {
            stack.unshift(el);
        }
        el = el.parentElement;
    }

    for (const content of stack) {
        const button = content.previousElementSibling;
        if (button?.classList.contains('collapsible')) {
            button.classList.add('active');
            content.style.display = "block";

            const openIcon = button.querySelector("img.icon-expanded");
            const closeIcon = button.querySelector("img.icon-collapsed");
            if (openIcon) openIcon.classList.add("hidden");
            if (closeIcon) closeIcon.classList.remove("hidden");
        }
    }

    setTimeout(() => {
        scrollWithOffset(target);
    }, 250);

}

document.addEventListener('DOMContentLoaded', () => {

    document.querySelectorAll('.anchor-link, a[href^="#"]').forEach(link => {
        link.addEventListener('click', function (event) {
            event.preventDefault();
            const anchorId = this.getAttribute('href').substring(1);
            const fullUrl = `${window.location.origin}${window.location.pathname}#${anchorId}`;

            navigator.clipboard.writeText(fullUrl);
            history.pushState(null, '', `#${anchorId}`);
            expandToAnchor(anchorId);
        });
    });

    if (window.location.hash) {
        const anchorId = window.location.hash.substring(1);
        setTimeout(() => {
            expandToAnchor(anchorId);
        }, 3000);
    }
});
