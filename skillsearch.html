        <h1>Character Skill Search</h1>
        <h3>Find characters with X number of points in one or more skills</h3>
        <div class="search-form">
            <div class="form-group">
                <label for="skills">Skills to search for (comma-separated):</label>
                <input type="text" id="skills" value="" placeholder="e.g., Hydra, Frozen Orb">
            </div>
            <div class="form-group">
                <label for="minPoints">Skill point conditions (comma-separated for multiple skills):</label>
                <input type="text" id="minPoints" value="19" placeholder=">10, <10, =0 or just 19">
                <small>
                    You can use &gt;, &gt;=, &lt;, &lt;=, = before a number (e.g., <code>&gt;10</code>, <code>&lt;10</code>, <code>=0</code>).<br>
                    If you provide fewer conditions than skills, the last one will be used for remaining skills.
                </small>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="searchHardcore" onchange="onLeagueChange()"> 
                    Search Hardcore (HC) characters
                </label>
                <small>
                    Unchecked: Softcore (SC) | Checked: Hardcore (HC)
                </small>
            </div>
<!--            <button onclick="searchIceFireArrow()">Search Ice Arrow + Fire Arrow</button> -->
            <button class="search-button" onclick="performCustomSearch()">Custom Search</button>
<!--            <button class="search-button" onclick="copySearchURL()">Copy Search URL</button> -->
<!--            <button onclick="loadDataOnly()">Load Data Only (Performance Test)</button> -->
        </div>

        <div id="results"></div>
    </div>

    <script>
        let characterData = null;
        let dataLoadTime = 0;
        let currentLeague = 'sc'; // 'sc' for softcore, 'hc' for hardcore
        let loadedLeague = null; // Track which league data is currently loaded

        function onLeagueChange() {
            const isHardcore = document.getElementById('searchHardcore').checked;
            const newLeague = isHardcore ? 'hc' : 'sc';
            
            if (newLeague !== currentLeague) {
                currentLeague = newLeague;
                // Clear loaded data when switching leagues
                characterData = null;
                loadedLeague = null;
                
                // Clear results
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';
                
                console.log(`Switched to ${newLeague.toUpperCase()} league. Data will be reloaded on next search.`);
            }
        }

        async function loadCharacterData() {
            const startTime = performance.now();
            
            // Check if we already have the correct data loaded
            if (characterData && loadedLeague === currentLeague) {
                console.log(`${currentLeague.toUpperCase()} data already loaded, skipping reload.`);
                return true;
            }
            
            const filename = currentLeague === 'hc' ? 'hc_ladder.json' : 'sc_ladder.json';
            const leagueName = currentLeague === 'hc' ? 'Hardcore' : 'Softcore';
            
            try {
                console.log(`Starting to fetch ${filename}...`);
                const response = await fetch(filename);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                console.log(`Parsing ${leagueName} JSON data...`);
                characterData = await response.json();
                loadedLeague = currentLeague;
                
                const endTime = performance.now();
                dataLoadTime = endTime - startTime;
                
                console.log(`${leagueName} data loaded successfully. ${characterData.length} characters loaded in ${dataLoadTime.toFixed(2)}ms`);
                return true;
                
            } catch (error) {
                console.error(`Error loading ${leagueName} character data:`, error);
                displayError(`Failed to load ${leagueName} character data: ${error.message}. Make sure ${filename} is in the same directory as this HTML file.`);
                return false;
            }
        }

        function findCharactersWithSpecificSkills(targetSkills, conditionsArray) {
            if (!characterData) {
                displayError('Character data not loaded. Please try again.');
                return [];
            }

            const searchStartTime = performance.now();
            const matchingCharacters = [];

            for (const char of characterData) {
                const charName = char.Name || "Unknown";
                const charClass = char.Class || "Unknown";
                const charLevel = char.Stats?.Level || "Unknown";

                // Extract all skills for this character
                const charSkills = {};
                const charSkillsLowerCase = {}; // For case-insensitive matching
                if (char.SkillTabs) {
                    for (const tab of char.SkillTabs) {
                        for (const skill of tab.Skills || []) {
                            const skillName = skill.Name;
                            const skillLevel = skill.Level;
                            charSkills[skillName] = skillLevel;
                            charSkillsLowerCase[skillName.toLowerCase()] = {
                                originalName: skillName,
                                level: skillLevel
                            };
                        }
                    }
                }

                // Check if character has all target skills with required conditions (case-insensitive)
                let hasAllSkills = true;
                const skillDetails = {};

                for (let i = 0; i < targetSkills.length; i++) {
                    const targetSkill = targetSkills[i];
                    const targetSkillLower = targetSkill.toLowerCase();
                    const foundSkill = charSkillsLowerCase[targetSkillLower];
                    const condition = i < conditionsArray.length ? conditionsArray[i] : conditionsArray[conditionsArray.length - 1];
                    const skillLevel = foundSkill ? foundSkill.level : 0; // Missing skill treated as 0 points

                    if (matchesCondition(skillLevel, condition)) {
                        const displayName = foundSkill ? foundSkill.originalName : targetSkill;
                        skillDetails[displayName] = skillLevel;
                    } else {
                        hasAllSkills = false;
                        break;
                    }
                }

                if (hasAllSkills) {
                    matchingCharacters.push({
                        name: charName,
                        class: charClass,
                        level: charLevel,
                        skills: skillDetails
                    });
                }
            }

            const searchEndTime = performance.now();
            const searchTime = searchEndTime - searchStartTime;

            return {
                characters: matchingCharacters,
                searchTime: searchTime,
                totalCharacters: characterData.length
            };
        }

        async function searchIceFireArrow() {
            displayLoading();
            
            if (!characterData) {
                const loaded = await loadCharacterData();
                if (!loaded) return;
            }

            const targetSkills = ["Ice Arrow", "Fire Arrow"];
            const conditionsArray = [{ op: '>=', value: 19 }];

            const result = findCharactersWithSpecificSkills(targetSkills, conditionsArray);
            displayResults(result, targetSkills, conditionsArray);
        }

        async function performCustomSearch() {
            displayLoading();
            
            if (!characterData) {
                const loaded = await loadCharacterData();
                if (!loaded) return;
            }

            const skillsInput = document.getElementById('skills').value;
            const minPointsInput = document.getElementById('minPoints').value;

            const targetSkills = skillsInput.split(',').map(skill => skill.trim()).filter(skill => skill.length > 0);

            const conditionsArray = parseConditionsInput(minPointsInput, targetSkills.length);

            if (targetSkills.length === 0) {
                displayError('Please enter at least one skill to search for.');
                return;
            }
            updateAddressBarWithSearch(skillsInput, minPointsInput, document.getElementById('searchHardcore').checked);
            const result = findCharactersWithSpecificSkills(targetSkills, conditionsArray);
            displayResults(result, targetSkills, conditionsArray);
        }

        function parseConditionsInput(minPointsInput, skillCount) {
            const tokens = minPointsInput.split(',').map(t => t.trim()).filter(t => t.length > 0);
            const conditions = [];
            const re = /^(<=|>=|<|>|=)?\s*(\d+)$/;

            for (const token of tokens) {
                const match = token.match(re);
                if (!match) continue;

                let op = match[1];
                const value = parseInt(match[2], 10);

                // Default operator: ">=" for positive numbers, "=" for zero
                if (!op) {
                    op = value === 0 ? '=' : '>=';
                }

                conditions.push({ op, value });
            }

            if (conditions.length === 0) {
                conditions.push({ op: '>=', value: 19 });
            }

            // If fewer conditions than skills, repeat the last condition
            while (conditions.length < skillCount) {
                conditions.push(conditions[conditions.length - 1]);
            }

            return conditions;
        }

        function matchesCondition(level, condition) {
            switch (condition.op) {
                case '>':
                    return level > condition.value;
                case '>=':
                    return level >= condition.value;
                case '<':
                    return level < condition.value;
                case '<=':
                    return level <= condition.value;
                case '=':
                    return level === condition.value;
                default:
                    return level >= condition.value;
            }
        }

        async function loadDataOnly() {
            displayLoading();
            
            const startTime = performance.now();
            const loaded = await loadCharacterData();
            const endTime = performance.now();

            if (loaded) {
                const leagueName = currentLeague === 'hc' ? 'Hardcore' : 'Softcore';
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = `
                    <div class="timing-info">
                        <h3>Performance Test - Data Loading Only (${leagueName})</h3>
                        <div class="stats">
                            <div class="stat-card">
                                <div class="stat-number">${characterData.length}</div>
                                <div class="stat-label">Total Characters</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${dataLoadTime.toFixed(2)}ms</div>
                                <div class="stat-label">Data Load Time</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${(characterData.length / (dataLoadTime / 1000)).toFixed(0)}</div>
                                <div class="stat-label">Characters/Second</div>
                            </div>
                        </div>
                        <p>${leagueName} data loaded successfully and ready for searching.</p>
                    </div>
                `;
            }
        }

        function displayLoading() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading">Loading and searching data...</div>';
        }

        function displayError(message) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `<div class="error">${message}</div>`;
        }

        function displayResults(result, targetSkills, conditionsArray) {
            const resultsDiv = document.getElementById('results');
            const leagueName = currentLeague === 'hc' ? 'Hardcore' : 'Softcore';
            
            const totalTime = dataLoadTime + result.searchTime;
            
            // Create a readable description of the search criteria
            let searchDescription = targetSkills.map((skill, index) => {
                const condition = index < conditionsArray.length ? conditionsArray[index] : conditionsArray[conditionsArray.length - 1];
                const opTextMap = {
                    '>': 'more than',
                    '>=': 'at least',
                    '<': 'less than',
                    '<=': 'at most',
                    '=': 'exactly'
                };
                const phrase = opTextMap[condition.op] || 'at least';
                return `${skill} (${phrase} ${condition.value} points)`;
            }).join(' and ');
            
            let html = '';

            if (result.characters.length === 0) {
                html += `
                    <div class="results">
                        <h3>No Results Found</h3>
                        <p>No ${leagueName} characters found with ${searchDescription}.</p>
                    </div>
                `;
            } else {
                html += `
                    <div class="results">
                        <h3>Search Results - ${leagueName} League</h3>
                        <p>Found ${result.characters.length} ${leagueName} character(s) with ${searchDescription}:</p>
                `;

                // Class color mapping
                const classColors = {
                    "Amazon": "rgb(255, 102, 105)",
                    "Assassin": "rgb(255, 255, 255)",
                    "Barbarian": "rgb(150, 105, 32)",
                    "Druid": "rgb(255, 186, 74)",
                    "Necromancer": "rgb(179, 255, 253)",
                    "Paladin": "rgb(255, 243, 112)",
                    "Sorceress": "rgb(188, 107, 255)"
                };

                for (const char of result.characters) {
                    // Build the trends URL based on class and league
                    const trendsClass = currentLeague === 'hc' ? `hc${char.class}` : char.class;
                    const trendsUrl = `https://trends.pathofdiablo.com/${trendsClass}#${char.name}`;
                    const classColor = classColors[char.class] || "#555";
                    
                    html += `
                        <div class="character-card" style="margin: 8px 0; padding: 12px; border-radius: 6px; border-left: 3px solid ${classColor};">
                            <div class="character-name">${char.name}</div>
                            <div class="character-info">
                                Class: ${char.class} | Level: ${char.level} | League: ${leagueName} |&nbsp; 
                                <a href=" ${trendsUrl}" target="_blank" style="color: #007bff; text-decoration: none;"> Trends Listing</a>
                            </div>
                            <div class="skills">
                                <strong>Skills:</strong><br>
                    `;
                    
                    for (const [skill, points] of Object.entries(char.skills)) {
                        html += `<div class="skill-item">${skill}: ${points} points</div><br>`;
                    }
                    
                    html += `
                            </div>
                        </div>
                    `;
                }

                html += '</div>';
            }

            // Add performance info at the bottom
            html += `
                <div class="timing-info">
                    <h3>${leagueName} Ladder</h3>
                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-number">${result.totalCharacters}</div>
                            <div class="stat-label">Total Characters Searched</div>
                        </div>
<!--                        <div class="stat-card">
                            <div class="stat-number">${dataLoadTime.toFixed(2)}ms</div>
                            <div class="stat-label">Data Load Time</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${result.searchTime.toFixed(2)}ms</div>
                            <div class="stat-label">Search Time</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${totalTime.toFixed(2)}ms</div>
                            <div class="stat-label">Total Time</div>
                        </div> -->
                    </div>
                </div>
            `;

            resultsDiv.innerHTML = html;
        }

        // Parse URL parameters and populate form
        function parseURLParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // Check if there are search parameters
            const skills = urlParams.get('skills');
            const levels = urlParams.get('levels');
            const league = urlParams.get('league');
            
            if (skills) {
                document.getElementById('skills').value = skills;
            }
            
            if (levels) {
                document.getElementById('minPoints').value = levels;
            }
            
            if (league) {
                const isHardcore = league.toLowerCase() === 'hc' || league.toLowerCase() === 'hardcore';
                document.getElementById('searchHardcore').checked = isHardcore;
                currentLeague = isHardcore ? 'hc' : 'sc';
            }
            
            // Return true if we have search parameters
            return skills !== null;
        }
        
        // Generate a shareable URL with current search parameters
        function generateSearchURL() {
            const skills = document.getElementById('skills').value;
            const levels = document.getElementById('minPoints').value;
            const isHardcore = document.getElementById('searchHardcore').checked;
            
            if (!skills.trim()) {
                alert('Please enter at least one skill to generate a URL.');
                return null;
            }
            
            const baseURL = window.location.origin + window.location.pathname;
            const params = new URLSearchParams();
            
            params.set('skills', skills);
            params.set('levels', levels || '19');
            params.set('league', isHardcore ? 'hc' : 'sc');
            
            return baseURL + '?' + params.toString();
        }
        
        // Copy search URL to clipboard
        function copySearchURL() {
            const url = generateSearchURL();
            if (!url) return;
            
            navigator.clipboard.writeText(url).then(() => {
                alert('Search URL copied to clipboard!\n\n' + url);
            }).catch(err => {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = url;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    alert('Search URL copied to clipboard!\n\n' + url);
                } catch (e) {
                    alert('Failed to copy URL. Here it is:\n\n' + url);
                }
                document.body.removeChild(textarea);
            });
        }
        
        // Auto-load data and execute search when page loads if URL params are present
        window.addEventListener('load', async () => {
            console.log('Page loaded, ready to search');
            
            // Parse URL parameters
            const hasSearchParams = parseURLParameters();
            
            // If we have search parameters, automatically perform the search
            if (hasSearchParams) {
                console.log('URL parameters detected, executing search...');
                await performCustomSearch();
            }
        });

    // Navigation functions
    function toggleMenu() {
        console.log('Toggle menu called');
        // Hamburger menu functionality
    }

    function setActive(buttonName) {
        console.log('Setting active button:', buttonName);
        // Set active button functionality
    }

    // Update the address bar with current search parameters (for shareable URL)
    function updateAddressBarWithSearch(skills, levels, isHardcore) {
        const baseURL = window.location.origin + window.location.pathname;
        const params = new URLSearchParams();
        params.set('skills', skills);
        params.set('levels', levels || '19');
        params.set('league', isHardcore ? 'hc' : 'sc');
        const newUrl = baseURL + '?' + params.toString();
        window.history.replaceState({}, '', newUrl);
    }    
    </script>
