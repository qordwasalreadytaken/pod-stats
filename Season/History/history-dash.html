<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PoD Class Counts Over Time</title>

<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: #111;
    color: #ddd;
}

.layout {
    display: flex;
    height: 100vh;
}

.controls {
    display: block;
}

select, input {
    padding: 6px;
}

.chart {
    width: 100%;
    height: 600px;
}

#tableContainer {
    margin-top: 20px;
    overflow-x: auto;
}

#tableContainer table {
    border-collapse: collapse;
    width: 100%;
    background: #1a1a1a;
}

#tableContainer th,
#tableContainer td {
    border: 1px solid #333;
    padding: 8px;
    text-align: center;
}

#tableContainer th {
    background: #222;
    color: #ddd;
}

#tableContainer tr:nth-child(even) {
    background: #181818;
}

#tableContainer tr:hover {
    background: #2a2a2a;
}

/* LEFT SIDEBAR */
.main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    box-sizing: border-box;
}

.sidebar {
    box-sizing: border-box;
}

/* controls styling */
.sidebar label {
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
    color: #aaa;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.sidebar select,
.sidebar input {
    width: 100%;
    padding: 6px;
    background: #222;
    color: #ddd;
    border: 1px solid #333;
    border-radius: 4px;
}

/* info section */
#seasonInfo {
    margin-top: 15px;
    font-size: 13px;
    line-height: 1.4;
}

#seasonInfo table {
    width: 100%;
}

#seasonInfo td {
    padding: 2px 0;
}

#seasonInfo td:first-child {
    color: #888;
}

h1 {
    margin-top: 0;
    margin-bottom: 15px;
}

.insight {
    background: #1e1e1e;
    border-left: 3px solid #555;
    padding: 6px 8px;
    margin-bottom: 6px;
    font-size: 13px;
    color: #ddd;
}

#eliteTable table {
    width: 60%;
    border-collapse: collapse;
    margin-top: 10px;
    margin-left: 50px;
    background: #1a1a1a;
}

#eliteTable th, #eliteTable td {
    padding: 6px;
    border-bottom: 1px solid #333;
    text-align: left;
}

#eliteTable tr:nth-child(even) {
    background: #181818;
}
</style>
</head>

<body>
<div class="layout">
<div class="sidebar">
<div class="controls">
    <label>Mode:</label>
    <select id="mode">
        <option value="sc">Softcore</option>
        <option value="hc">Hardcore</option>
    </select>

    <label>Level:</label>
    <select id="level">
        <option value="80">80+</option>
        <option value="90">90+</option>
        <option value="95" selected>95+</option>
        <option value="96">96+</option>
        <option value="97">97+</option>
        <option value="98">98+</option>
        <option value="99">99+</option>
    </select>

    <label>Top:</label>

    <select id="cutoff">
        <option value="1000" selected>Top 1000</option>
        <option value="500">Top 500</option>
        <option value="250">Top 250</option>
        <option value="100">Top 100</option>
    </select>
<label>Season:</label>
<input id="season" type="range" min="1" max="13" value="13">

<span id="seasonLabel">13</span>
<div id="seasonInfo" class="season-info"></div>

</div>
</div>
<div class="main">
<h1>PoD Class Counts from the Top 1K Over Time</h1>
<br>
<div id="pie" class="chart"></div>
<div id="lines" class="chart"></div>
<br>
<div id="trends" class="chart"></div>
<br>
<h1>Raw counts of the top <span id="cutoffDisplay">1000</span> at Levels <span id="levelDisplay">95+</span></h1>
<div id="tableContainer"></div>
<br>
<div id="insights"></div>
<div id="eliteTable"></div>
</div>
<script>
let DATA = null;
let timer = null;

const CLASSES = ["ama","asn","bar","dru","nec","pal","sor"];

const CLASS_COLORS = {
    "Amazon": "rgb(255, 102, 105)",
    "Assassin": "rgb(255, 255, 255)",
    "Barbarian": "rgb(150, 105, 32)",
    "Druid": "rgb(255, 186, 74)",
    "Necromancer": "rgb(179, 255, 253)",
    "Paladin": "rgb(255, 243, 112)",
    "Sorceress": "rgb(188, 107, 255)"
};

const INSIGHT_TYPES = {
    DOMINANCE: "dominance",
    SHIFT: "shift",
    ELITE: "elite",
    STABILITY: "stability",
    DIVERSITY: "diversity",
    TIME: "temporal",
    OUTLIER: "outlier"
};

async function load() {
    const res = await fetch("meta_analysis.json");
    DATA = await res.json();

    document.getElementById("season").value = season;
    document.getElementById("seasonLabel").textContent = season;

    renderAll();
}

function seasons() {
    return Object.keys(DATA.sc).map(Number).sort((a,b)=>a-b);
}

function get(mode, season, cutoff, level) {
    return DATA?.[mode]?.[season]?.[cutoff]?.[level] || {
        counts: {},
        total: 0
    };
}

function renderSeason(season) {
    const mode = document.getElementById("mode").value;
    const level = document.getElementById("level").value;
    const cutoff = document.getElementById("cutoff").value;

    const d = get(mode, season, cutoff, level);

    const x = [];
    const y = [];
    const colors = [];

    for (const cls of CLASSES) {
        const name = DATA.classes[cls];

        x.push(name);
        y.push(d.counts?.[cls] || 0);
        colors.push(CLASS_COLORS[name]);
    }

    Plotly.react("lines", [{
        type: "bar",
        x,
        y,
        marker: {
            color: colors,
            line: {
                color: "#444",
                width: 1
            }
        }
    }], {
        title: `Season ${season} (${mode.toUpperCase()} Top ${cutoff} • ${level}+)`,

        paper_bgcolor: "#1a1a1a",
        plot_bgcolor: "#222222",

        hoverlabel: {
            bgcolor: "#2a2a2a",
            bordercolor: "#555",
            font: { color: "#dddddd" }
        },

        font: {
            color: "#dddddd",
            size: 14
        },

        xaxis: {
            color: "#dddddd",
            gridcolor: "#333333"
        },

        yaxis: {
            title: "Characters",
            color: "#dddddd",
            gridcolor: "#333333"
        },

        margin: {
            t: 60,
            l: 60,
            r: 30,
            b: 60
        }
    }, {
        responsive: true,
        displaylogo: false
    });
}

function renderAll() {
    const mode = document.getElementById("mode").value;
    const cutoff = document.getElementById("cutoff").value;
    const level = document.getElementById("level").value;

    const prevSeason = season - 1;

    renderSeason(season);
    renderTable();
    renderSeasonInfo();
    renderTrendChart();
    renderPieChart();

    const insights = generateInsights(
        DATA,
        mode,
        season,
        cutoff,
        level,
        prevSeason
    );

    renderInsights(insights);
    renderEliteTable(DATA, mode, season, level);
    document.getElementById("levelDisplay").textContent = level + "+";
}

function renderTable() {
    const mode = document.getElementById("mode").value;
    const level = document.getElementById("level").value;
    const cutoff = document.getElementById("cutoff").value;

    let html = "<table>";

    html += "<tr>";
    html += "<th>Season</th>";

    for (const cls of CLASSES) {
        html += `<th>${DATA.classes[cls]}</th>`;
    }

    html += "<th>Total</th>";
    html += "</tr>";

    const seasons = Object.keys(DATA[mode])
        .map(Number)
        .sort((a, b) => a - b);

    for (const s of seasons) {
        const d = get(mode, s, cutoff, level);

        html += "<tr>";
        html += `<td>${s}</td>`;

        for (const cls of CLASSES) {
            html += `<td>${d.counts?.[cls] || 0}</td>`;
        }

        html += `<td><strong>${d.total}</strong></td>`;
        html += "</tr>";
    }

    html += "</table>";

    document.getElementById("tableContainer").innerHTML = html;
}

function renderTrendChart() {
    const mode = document.getElementById("mode").value;
    const level = document.getElementById("level").value;
    const cutoff = document.getElementById("cutoff").value;

    const seasons = Object.keys(DATA[mode])
        .map(Number)
        .sort((a, b) => a - b);

    const traces = [];

    for (const cls of CLASSES) {
        const label = DATA.classes[cls];

        traces.push({
            x: seasons,
            y: seasons.map(s =>
                get(mode, s, cutoff, level).counts?.[cls] || 0
            ),
            mode: "lines+markers",
            name: label,
            line: {
                color: CLASS_COLORS[label],
                width: 3
            },
            marker: {
                color: CLASS_COLORS[label],
                size: 8,
                line: {
                    color: "#333",
                    width: 1
                }
            }
        });
    }

    Plotly.react("trends", traces, {
        title: `${mode.toUpperCase()} Class Trends (Top ${cutoff}, ${level}+)`,

        paper_bgcolor: "#1a1a1a",
        plot_bgcolor: "#222222",

        font: {
            color: "#dddddd"
        },

        xaxis: {
            title: "Season",
            tickmode: "array",
            tickvals: seasons,
            gridcolor: "#333"
        },

        yaxis: {
            title: "Characters",
            gridcolor: "#333"
        },

        legend: {
            bgcolor: "#222"
        },

        hoverlabel: {
            bgcolor: "#2a2a2a",
            font: {
                color: "#ddd"
            }
        }
    }, {
        responsive: true,
        displaylogo: false
    });
}

function renderSeasonInfo() {
    const mode = document.getElementById("mode").value;
    const level = document.getElementById("level").value;
    const cutoff = document.getElementById("cutoff").value;

    const seasonData = DATA?.[mode]?.[season];
    const d = get(mode, season, cutoff, level);

    if (!seasonData) {
        document.getElementById("seasonInfo").innerHTML =
            "<p>No data available.</p>";
        return;
    }

    let html = `
        <h2>Season ${season}</h2>

        <table>
            <tr>
                <td>Approx. Length</td>
                <td>${seasonData.season_length ?? "Unknown"} months</td>
            </tr>

            <tr>
                <td>Mode</td>
                <td>${mode === "sc" ? "Softcore" : "Hardcore"}</td>
            </tr>

            <tr>
                <td>Top Ladder Slice</td>
                <td>Top ${cutoff}</td>
            </tr>

            <tr>
                <td>Level Filter</td>
                <td>${level}+</td>
            </tr>

            <tr>
                <td>Characters Matching</td>
                <td>${d.total}</td>
            </tr>

            <tr>
                <td>Median Level</td>
                <td>${d.median_level}</td>
            </tr>

            <tr>
                <td>Average Level</td>
                <td>${d.average_level}</td>
            </tr>
    `;

    if (d.account_coverage >= 75) {
        html += `
            <tr>
                <td>Unique Accounts</td>
                <td>${d.unique_accounts}</td>
            </tr>

            <tr>
                <td>Account Coverage</td>
                <td>${d.account_coverage}%</td>
            </tr>
        `;
    }

    html += "</table>";

    document.getElementById("seasonInfo").innerHTML = html;
}

function renderPieChart() {
    const mode = document.getElementById("mode").value;
    const level = document.getElementById("level").value;
    const cutoff = document.getElementById("cutoff").value;

    const d = DATA[mode][season]?.[cutoff]?.[level];
    const prev = DATA[mode]?.[season - 1]?.[cutoff]?.[level];

    if (!d) return;

    const labels = [];
    const values = [];
    const colors = [];
    const customData = [];

    for (const cls of CLASSES) {
        const curr = d.counts?.[cls] || 0;
        const prevCount = prev?.counts?.[cls] || 0;

        labels.push(DATA.classes[cls]);
        values.push(curr);
        colors.push(CLASS_COLORS[DATA.classes[cls]]);

        let changeText = "No previous season";

        if (prevCount > 0) {
            const pct = ((curr - prevCount) / prevCount) * 100;

        changeText =
            `${pct > 0 ? "+" : ""}${pct.toFixed(1)}% (${curr - prevCount > 0 ? "+" : ""}${curr - prevCount}) vs previous season`;
        }

        customData.push(changeText);
    }

    Plotly.react("pie", [{
        type: "pie",

        labels: labels,
        values: values,

        textinfo: "percent+label",
        textposition: "inside",

        customdata: customData,

        marker: {
            colors: colors,
            line: {
                color: "#333",
                width: 1
            }
        },

        hovertemplate:
            "<b>%{label}</b><br>" +
            "%{value} characters<br>" +
            "%{percent}<br>" +
            "%{customdata}<extra></extra>"
    }], {
        title: `Season ${season} Class Distribution (${mode.toUpperCase()} ${level}+ Top ${cutoff})`,

        paper_bgcolor: "#1a1a1a",
        plot_bgcolor: "#222222",

        font: {
            color: "#ddd"
        },

        legend: {
            bgcolor: "#222",
            font: {
                color: "#ddd"
            }
        },

        hoverlabel: {
            bgcolor: "#2a2a2a",
            bordercolor: "#555",
            font: {
                color: "#ddd"
            }
        }
    }, {
        responsive: true,
        displaylogo: false
    });
}

function formatElitePhrase(name, delta) {
    if (delta > 0) {
        return `${name} appears more frequently in Top 100 than expected from its overall ladder presence`;
    } else {
        return `${name} appears less frequently in Top 100 than expected from its overall ladder presence`;
    }
}

function formatEliteInsight(clsName, eliteShare, generalShare) {
    const diffPct = ((eliteShare - generalShare) * 100).toFixed(1);

    if (eliteShare > generalShare) {
        return `${clsName} performs better in Top 100 than in the broader ladder (elite share is +${diffPct} percentage points higher)`;
    } else {
        return `${clsName} performs worse in Top 100 than in the broader ladder (elite share is ${diffPct} percentage points lower)`;
    }
}

function formatEliteVerbose(clsName, eliteShare, generalShare) {
    const elitePct = eliteShare * 100;
    const generalPct = generalShare * 100;

    const diff = elitePct - generalPct;

    const direction =
        diff > 0
            ? "more common in the top 100"
            : "less common in the top 100";

    return `${clsName} make up ${generalPct.toFixed(1)}% of the overall ladder and ${elitePct.toFixed(1)}% of the Top 100 — ${direction}.`;
}

function renderEliteTable(data, mode, season, level) {
    const top100 = data[mode][season]?.["100"]?.[level];
    const top1000 = data[mode][season]?.["1000"]?.[level];

    if (!top100 || !top1000) return;

    const rows = [];

    for (const cls of Object.keys(top1000.counts)) {
        const elite = top100.counts?.[cls] || 0;
        const general = top1000.counts?.[cls] || 0;

        const eliteShare = elite / (top100.total || 1);
        const generalShare = general / (top1000.total || 1);

        const diff = (eliteShare - generalShare) * 100;

        rows.push({
            cls,
            name: data.classes[cls],
            diff
        });
    }

    rows.sort((a, b) => b.diff - a.diff);

    let html = `
        <table>
            <tr>
                <th>Class</th>
                <th>Elite Bias</th>
            </tr>
    `;

    for (const r of rows) {
        const sign = r.diff > 0 ? "+" : "";
        html += `
            <tr>
                <td>${r.name}</td>
                <td>${sign}${r.diff.toFixed(2)}%</td>
            </tr>
        `;
    }

    html += "</table>";

    document.getElementById("eliteTable").innerHTML = html;
}

function generateInsights(data, mode, season, cutoff, level, prevSeason) {
    const d = data[mode][season]?.[cutoff]?.[level];
    const prev = data[mode][prevSeason]?.[cutoff]?.[level];

    if (!d) return [];

    const insights = [];

    const seasons = Object.keys(data[mode]).filter(s => !isNaN(Number(s)));

    const totals = seasons
        .map(s => data[mode][s]?.[cutoff]?.[level]?.total)
        .filter(v => v != null)
        .sort((a, b) => b - a);

    const rank = totals.indexOf(d.total) + 1;

    // -----------------------------
    // 1. Dominant class
    // -----------------------------
    const sorted = Object.entries(d.counts)
        .sort((a, b) => b[1] - a[1]);
    const [topClass, topCount] = sorted[0];
    const topShare = topCount / d.total;
    if (sorted.length > 0) {
        const [topClass, topCount] = sorted[0];
        const total = d.total || 1;
        const pct = (topCount / total) * 100;

/*        insights.push({
            text: `${DATA.classes[topClass]} is the most played class (${pct.toFixed(1)}% of Top ${cutoff}, Level ${level}+)`,
            type: "dominance",
            score: 4
        }); */
    }

    // -----------------------------
    // 2. Meta concentration
    // -----------------------------
    let explanation;

    if (d.dominance > 0.25) {
        explanation = "A small number of classes dominated the ladder, with limited diversity in high-level character distribution.";
    }
    else if (d.dominance > 0.18) {
        explanation = "A few classes were clearly more popular than others, but there is still meaningful class diversity in the meta.";
    }
    else {
        explanation = "Class distribution was relatively even, with no single class dominating high-level play.";
    }

    let impact;

    if (d.dominance > 0.25) {
        impact = "This often indicates a meta where optimal builds were well-established and class diversity was reduced.";
    }
    else if (d.dominance > 0.18) {
        impact = "This suggests a healthy but somewhat optimized meta, where some classes had a clear edge.";
    }
    else {
        impact = "This usually reflects experimental or early-cycle metas where multiple classes remain viable.";
    }

    if (topShare >= 0.40) {
        explanation = "Extremely concentrated meta dominated by a single class";
    }
    else if (topShare >= 0.30) {
        explanation = "Highly concentrated meta with a clear dominant class";
    }
    else if (topShare >= 0.22) {
        explanation = "Moderately concentrated meta where one class had a noticeable lead";
    }
    else {
        explanation = "Relatively diverse meta with no overwhelming dominant class.";
    }

    let dominanceNote = "";

    if (topShare >= 0.40) {
        dominanceNote = "<br>This means nearly 1 in every 2 characters were the same class";
    }
    else if (topShare >= 0.30) {
        dominanceNote = "<br>This means roughly 1 in 3 characters were the same class";
    }

    insights.push({
        text: `${explanation} - top class: ${DATA.classes[topClass]} at ${(topShare * 100).toFixed(1)}% ${dominanceNote}`,
        type: "dominance",
        score: 3
    });


    // -----------------------------
    // 3. Biggest shifts vs last season
    // -----------------------------
    if (prev?.counts) {
        const changes = [];

        for (const cls of Object.keys(d.counts)) {
            const curr = d.counts[cls] || 0;
            const last = prev.counts[cls] || 0;

            changes.push({
                cls,
                diff: curr - last
            });
        }

        const sorted = [...changes].sort((a, b) => b.diff - a.diff);

        const biggestGainer = sorted.find(c => c.diff > 0);
        const biggestLoser = [...sorted].reverse().find(c => c.diff < 0);

        if (biggestGainer) {
            insights.push({
                text: `${DATA.classes[biggestGainer.cls]} gained the most representation since last season (+${biggestGainer.diff}).`,
                type: "shift",
                score: 5
            });
        }

        if (biggestLoser) {
            insights.push({
                text: `${DATA.classes[biggestLoser.cls]} lost the most representation since last season (${biggestLoser.diff}).`,
                type: "shift",
                score: 5
            });
        }
    }

    // -----------------------------
    // 4. Elite vs general divergence
    // -----------------------------
    const top100 = data[mode][season]?.["100"]?.[level];
    const top1000 = data[mode][season]?.["1000"]?.[level];

    if (!top100 || !top1000) return insights;

    const divergences = [];

    for (const cls of Object.keys(top1000.counts)) {
        const elite = top100.counts?.[cls] || 0;
        const general = top1000.counts?.[cls] || 0;

        const eliteShare = elite / (top100.total || 1);
        const generalShare = general / (top1000.total || 1);

        const shareDiff = eliteShare - generalShare;

        divergences.push({
            cls,
            eliteShare,
            generalShare,
            shareDiff
        });
    }

    const gainers = [...divergences]
        .sort((a, b) => b.shareDiff - a.shareDiff)
        .slice(0, 2);

    const losers = [...divergences]
        .sort((a, b) => a.shareDiff - b.shareDiff)
        .slice(0, 2);

    function formatElite(cls, eliteShare, generalShare) {
        const diffPct = ((eliteShare - generalShare) * 100).toFixed(1);

        if (eliteShare > generalShare) {
            return `${cls} performs better in Top 100 than in the broader ladder (+${diffPct} percentage points)`;
        } else {
            return `${cls} performs worse in Top 100 than in the broader ladder (${diffPct} percentage points)`;
        }
    }

    if (gainers[0]) {
        const g0 = gainers[0];

        insights.push({
            text: formatEliteVerbose(
                DATA.classes[g0.cls],
                g0.eliteShare,
                g0.generalShare
            ),
            type: "elite",
            score: 5
        });
    }

    if (losers[0]) {
        const l0 = losers[0];

        insights.push({
            text: formatEliteVerbose(
                DATA.classes[l0.cls],
                l0.eliteShare,
                l0.generalShare
            ),
            type: "elite",
            score: 5
        });
    }

    if (gainers[1]) {
        const g1 = gainers[1];

        insights.push({
            text: formatEliteVerbose(
                DATA.classes[g1.cls],
                g1.eliteShare,
                g1.generalShare
            ),
            type: "elite",
            score: 4
        });
    }

    if (losers[1]) {
        const l1 = losers[1];

        insights.push({
            text: formatEliteVerbose(
                DATA.classes[l1.cls],
                l1.eliteShare,
                l1.generalShare
            ),
            type: "elite",
            score: 4
        });
    }

    // -----------------------------
    // 5. Season Context
    // -----------------------------
    const seasonData = data[mode][season];

    if (seasonData) {
        if (Number(level) >= 97 && Number(cutoff) <= 250){
            if (rank === 1) {
                insights.push({
                    text: `This season had the highest number of Level ${level}+ characters in the Top ${cutoff}.`,
                    type: "season",
                    score: 4
                });
            }
            else if (rank === totals.length) {
                insights.push({
                    text: `This season had the fewest Level ${level}+ characters in the Top ${cutoff}.`,
                    type: "season",
                    score: 4
                });
            }
        }
        // Season length
        const months = seasonData.season_length;

        if (months != null) {
            if (months <= 5) {
                insights.push({
                    text: `This was a relatively short season (${months} months), leaving less time for players to push into the highest level brackets.`,
                    type: "season",
                    score: 3
                });
            }
            else if (months >= 12) {
                insights.push({
                    text: `This was one of the longer PoD seasons (${months} months), giving players more time to develop high-level characters.`,
                    type: "season",
                    score: 3
                });
            }
        }

        // Ladder completion
        const completion = d.total / Number(cutoff);

        if (Number(level) >= 95 && completion < 0.5) {
            insights.push({
                text: `Only ${d.total} of the Top ${cutoff} characters reached Level ${level}+, highlighting how rare these characters were this season.`,
                type: "season",
                score: 4
            });
        }

        // Average vs median
        if (
            d.average_level != null &&
            d.median_level != null
        ) {
            const gap = d.average_level - d.median_level;

            if (gap >= 1.0) {
                insights.push({
                    text: `A small number of exceptionally high-level characters pulled the average level above the median.`,
                    type: "season",
                    score: 2
                });
            }
            else if (gap <= -1.0) {
                insights.push({
                    text: `The level distribution skewed toward lower-ranked characters within this filter.`,
                    type: "season",
                    score: 2
                });
            }
        }
    }

    // -----------------------------
    // 6. Participation Context
    // -----------------------------
    if (
        d.unique_accounts &&
        d.account_coverage >= 75 &&
        Number(level) >= 95
    ) {
        const charsPerAccount = d.total / d.unique_accounts;

        if (charsPerAccount <= 1.3) {
            insights.push({
                text: `High-level participation was broadly distributed, averaging ${charsPerAccount.toFixed(1)} qualifying characters per account.`,
                type: "population",
                score: 3
            });
        }
        else if (charsPerAccount >= 1.8) {
            insights.push({
                text: `A relatively small group of accounts contributed multiple high-level characters, averaging ${charsPerAccount.toFixed(1)} qualifying characters per account.`,
                type: "population",
                score: 3
            });
        }
    }


    // -----------------------------
    // FINAL: sort by importance
    // -----------------------------
    return insights.sort((a, b) => b.score - a.score);
}

function renderInsights(insights) {
    const sections = {
        dominance: {
            title: "Meta Snapshot"
        },
        shift: {
            title: "Changes Since Last Season"
        },
        season: {
            title: "Season Context"
        },
        population: {
            title: "Population Context"
        },
        elite: {
            title: "Top 100 vs Overall Ladder Representation (Elite Bias)"
        }

    };

    let html = "<h3>Season Analysis</h3>";

    for (const [type, config] of Object.entries(sections)) {
        const items = insights.filter(i => i.type === type);

        if (items.length === 0) continue;

        html += `<div class="insight-section">`;
        html += `<h4>${config.title}</h4>`;
        html += `<ul>`;

        for (const item of items) {
            html += `<li>${item.text}</li>`;
        }

        html += `</ul>`;
        html += `</div>`;
    }

    document.getElementById("insights").innerHTML = html;
}

function scoreInsight(type, magnitude = 1) {
    const base = {
        dominance: 3,
        shift: 5,
        elite: 5,
        stability: 4,
        diversity: 3,
        temporal: 4,
        outlier: 5
    };

    return base[type] * magnitude;
}


let season = 13;

document.getElementById("season").addEventListener("input", (e) => {
    season = Number(e.target.value);
    document.getElementById("seasonLabel").textContent = season;
    renderAll();
});

document.getElementById("mode").addEventListener("change", renderAll);

document.getElementById("level").addEventListener("change", renderAll);

document.getElementById("cutoff").addEventListener("change", renderAll);

load();

</script>
